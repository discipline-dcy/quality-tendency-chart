<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>质量趋势</title>
<style>
  /* ═══════════════════════════════════════════════════════════
     配色 —— 与生产看板同一套 token，暗色单主题
     车间大屏常年长亮，暗背景眩光小、夜班不刺眼
     ═══════════════════════════════════════════════════════════ */
  :root {
    --plane:     #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #898781;
    --hairline:  rgba(255,255,255,0.10);

    /* 图表专用：网格与轴要比数据弱一档，永远是实线 */
    --grid:      #2c2c2a;
    --axis:      #383835;

    /* 序列色只有一个 —— 见设计方案「为什么不给不良品数单独配色」 */
    --series-1:  #3987e5;

    /* 状态色：固定四档，只表示状态，绝不当序列色用 */
    --good:      #0ca30c;
    --warning:   #fab219;
    --critical:  #d03b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(16px, 1.8vw, 32px);
    min-height: 100vh;
    background: var(--plane);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Noto Sans CJK SC", sans-serif;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vw, 22px);
  }

  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 16px; }
  h1 { margin: 0; font-size: clamp(20px, 2.2vw, 38px); font-weight: 600; letter-spacing: .04em; }
  .range { font-size: clamp(13px, 1.2vw, 20px); color: var(--ink-2); }
  .clock {
    margin-left: auto;
    font-size: clamp(18px, 2vw, 34px);
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }

  /* ── 提示条：数据连接异常 / 口径对不上 ─────────────────── */
  .banner {
    display: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: clamp(13px, 1.2vw, 19px);
    line-height: 1.5;
  }
  .banner.show { display: block; }
  .banner.err  { background: rgba(208,59,59,0.15);  border: 1px solid var(--critical); }
  .banner.warn { background: rgba(250,178,25,0.13); border: 1px solid var(--warning); }

  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: clamp(14px, 1.5vw, 26px);
  }

  .label {
    font-size: clamp(12px, 1.05vw, 17px);
    color: var(--ink-muted);
    margin-bottom: .4em;
  }

  .top {
    display: grid;
    grid-template-columns: minmax(210px, 1fr) 3.4fr;
    gap: clamp(12px, 1.4vw, 22px);
  }
  @media (max-width: 900px) { .top { grid-template-columns: 1fr; } }

  .kpis { display: flex; flex-direction: column; gap: clamp(12px, 1.4vw, 22px); }

  /* 本页最大的数字，但仍比主看板的「今日总完成率」小一号 ——
     整个大屏体系里主数字只能有一个 */
  .figure {
    font-size: clamp(38px, 5vw, 76px);
    font-weight: 600;
    line-height: 1;
    /* 大号数字用默认比例字形，tabular-nums 会显得松散 */
  }
  .figure .unit { font-size: .38em; font-weight: 500; color: var(--ink-2); margin-left: .1em; }

  .stat-value { font-size: clamp(22px, 2.6vw, 42px); font-weight: 600; line-height: 1.1; }

  /* 状态标记：图标形状 + 文字，颜色只是辅助 */
  .status {
    display: inline-flex; align-items: center; gap: .45em;
    font-size: clamp(13px, 1.25vw, 21px);
    color: var(--ink-2);
    margin-top: .5em;
    white-space: nowrap;
  }
  .delta {
    font-size: clamp(12px, 1.1vw, 18px);
    color: var(--ink-2);
    margin-top: .45em;
    font-variant-numeric: tabular-nums;
  }

  .panels { display: flex; flex-direction: column; gap: clamp(10px, 1.1vw, 18px); }
  .panel-title {
    display: flex; align-items: baseline; gap: .8em; flex-wrap: wrap;
    font-size: clamp(13px, 1.15vw, 20px);
    font-weight: 500;
    margin: 0 0 .5em;
  }
  .panel-title .sub { font-size: .8em; font-weight: 400; color: var(--ink-muted); }

  /* 图容器高度随内容走，不写死 —— 写死会把 x 轴文字挤出去 */
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* 小倍数：一行放下全部生产类型。类型是有限的几个（流水/改型/清分机），
     不像产品代码那样会长出十几个，所以不需要换行的栅格 */
  .spark-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(10px, 1.2vw, 20px);
  }
  @media (max-width: 820px) { .spark-grid { grid-template-columns: 1fr; } }

  .spark-card { display: flex; flex-direction: column; gap: .4em; min-width: 0; }
  .spark-head { display: flex; align-items: baseline; gap: .5em; min-width: 0; }
  .spark-name {
    font-size: clamp(13px, 1.15vw, 20px); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .spark-rate {
    margin-left: auto;
    font-size: clamp(15px, 1.4vw, 24px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .spark-status { font-size: clamp(11px, .95vw, 15px); color: var(--ink-2); display: flex; align-items: center; gap: .4em; }
  .spark-target { font-size: clamp(11px, .9vw, 14px); color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  /* 样本量撑不起趋势的类型：不画图，占位写明为什么。
     高度和迷你图对齐，三张卡的基线才不会错开 */
  .spark-none {
    display: flex; align-items: center;
    aspect-ratio: 240 / 56;
    font-size: clamp(11px, .95vw, 15px);
    color: var(--ink-muted);
    line-height: 1.45;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }

  /* 表格视图：每张图的等价物，不靠颜色传信息 */
  details.table-view { margin-top: .5em; }
  details.table-view summary {
    font-size: clamp(12px, 1.05vw, 17px);
    color: var(--ink-muted);
    cursor: pointer;
    list-style: none;
  }
  details.table-view summary::-webkit-details-marker { display: none; }
  details.table-view summary::before { content: "▸ "; }
  details.table-view[open] summary::before { content: "▾ "; }
  .scroller { overflow-x: auto; }
  table { border-collapse: collapse; margin-top: .8em; font-size: clamp(12px, 1.05vw, 17px); }
  th, td {
    padding: .45em .9em .45em 0;
    text-align: right;
    font-variant-numeric: tabular-nums;   /* 成列的数字必须对齐 */
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-muted); font-weight: 500; }

  footer {
    font-size: clamp(11px, 1vw, 16px);
    color: var(--ink-muted);
    display: flex; flex-wrap: wrap; gap: 1.5em;
  }

  /* 页面里唯一的链接（去 /setup 配账号）。
     不用蓝色 —— 这套配色里蓝是序列色、红黄绿是状态色，都有各自的含义，
     借过来当链接色会让"蓝＝数据线"这条规则出现例外。改用下划线 + 提亮一档
     来表示可点，不引入新颜色，五米外也不会跟旁边的数字抢注意力 */
  a {
    color: var(--ink-2);
    text-decoration: underline;
    text-underline-offset: .25em;
  }
  a:hover { color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  /* 提示条自带背景色，链接在上面跟着正文走就行，再变色只会更难认 */
  .banner a { color: inherit; font-weight: 600; }
</style>
</head>
<body>

  <header>
    <h1>质量趋势</h1>
    <span class="range" id="range">—</span>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <div class="banner err"  id="bannerErr"></div>
  <div class="banner warn" id="bannerWarn"></div>

  <section class="top">
    <div class="kpis">
      <div class="card">
        <div class="label" id="rateLabel">最新一日良品率</div>
        <div class="figure"><span id="figRate">--</span><span class="unit">%</span></div>
        <div class="status" id="figStatus"></div>
        <div class="delta" id="figDelta"></div>
      </div>
      <div class="card">
        <div class="label">当日不良品</div>
        <div class="stat-value"><span id="figDefect">--</span> 件</div>
        <div class="delta" id="figDefectDelta"></div>
      </div>
    </div>

    <div class="panels">
      <div class="card">
        <h2 class="panel-title">
          良品率趋势
          <span class="sub" id="trendSub">按日</span>
        </h2>
        <svg id="trend" viewBox="0 0 1200 300" role="img" aria-label="良品率按日趋势折线图"></svg>
      </div>

      <div class="card">
        <h2 class="panel-title">
          不良品数
          <span class="sub">件 / 日 · 纵轴自 0 起</span>
        </h2>
        <svg id="defects" viewBox="0 0 1200 190" role="img" aria-label="每日不良品数柱状图"></svg>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="panel-title">
      各生产类型合格率
      <span class="sub" id="groupSub">共用同一纵轴，形状可直接互比</span>
    </h2>
    <div class="spark-grid" id="sparks"></div>

    <!-- 默认展开。藏起来的值等于不存在，而这一份是所有图的等价物。
         但电脑版**不做自动滚动** —— 这里有鼠标有滚轮，页面自己动只会
         跟正在读数的人抢控制权。大屏版没有鼠标，那边才需要自动滚 -->
    <details class="table-view" open>
      <summary>表格视图（全部数值）</summary>
      <div class="scroller" id="tableView"></div>
    </details>
  </section>

  <footer>
    <span>数据每 60 秒自动刷新</span>
    <span id="source">—</span>
    <span id="lastUpdate">尚未获取数据</span>
    <!-- 用相对路径，别写死 localhost：大屏上看板是通过服务器内网 IP 打开的，
         写死的话点过去会跳到大屏自己那台机器上，那儿根本没有服务 -->
    <a href="/setup">配置 OA 账号</a>
  </footer>

<script>
// ═══════════════════════════════════════════════════════════════
// 数据源
//
// 正常走后端 /api/quality。直接双击打开本文件（没有后端）时，
// 自动退回内置示例数据，方便离线看版面。
//
// 后端口径（由需求方指定）：
//   分子 ← 接口4 检验异常录入列表 ProductionInspectionList 的不良数
//   分母 ← 接口5 检验日报列表   InspectionDailyReportList  的检验数量
// ═══════════════════════════════════════════════════════════════

  minSample: 50,
  rateFloor: 90,        // 纵轴最低画到 90%；低于此值的日期标红

  // 会被当成真 bug 查半天

    { t: '07-26', date: '2026-07-26', output:    0, defect:   0, rate: null },  // 周末无检验
    { t: '07-27', date: '2026-07-27', output:  414, defect:  18, rate: 95.7 },
    { t: '07-28', date: '2026-07-28', output:  544, defect:  17, rate: 96.9 },
    { t: '07-29', date: '2026-07-29', output:  501, defect:  27, rate: 94.6 },
    { t: '07-30', date: '2026-07-30', output:  351, defect:  18, rate: 94.9 },
    { t: '07-31', date: '2026-07-31', output:  351, defect:  21, rate: 94   },
    { t: '08-01', date: '2026-08-01', output:  198, defect:  16, rate: 91.9 },  // 低谷
    { t: '08-02', date: '2026-08-02', output:    0, defect:   0, rate: null },

    { t: '08-04', date: '2026-08-04', output:    0, defect:   0, rate: null },
  ],
  // 主视觉：按检验类型。四张卡对应车间实际的四条线，量级和形态照真实数据捏的 ——
  // 清分机日均只有个位数，是 sparse（样本撑不起趋势）那一档的样板
  //
  // ⚠ 四张卡不是同一个指标，metricLabel 必须跟着数一起给：
  //   流水 = 一次直通率（三环节相乘，天然低一截）、组件 = 抽检一次合格率、
  //   改型和清分机 = 一次合格率。四项在品质部考核表里全是「一次」口径。
  //   目标线是季度 KPI，这里取 Q3 的那一档
  types: [
    { name: '流水生产', qty: 3516, defect: 154, rate: 82.4, yieldRate: 95.6,
      metric: 'fpy', metricLabel: '一次直通率', target: 90, mode: 'daily',
      activeDays: 12, medianQty: 274, noDenomDefect: 0, lowSample: false,
      stages: [
        { id: 'electrical', label: '电检',   qty:  607, defect: 81, rate: 86.7 },
        { id: 'assembly',   label: '装配检', qty: 1515, defect: 39, rate: 97.4 },

      ],

      sparkQty:  [  216,  304,  316,  226,    0,  186,  387,  344,  186,  257,  162,    0,  274,    0],
      // 07-30 那天流水共 186 件，但电检只做了 15 件 —— 直通率被拉到 43.8%。
      // 按当日总量判它是达标样本，只有按环节判才标得出来

    { name: '组件生产', qty: 3066, defect: 1, qualified: 3065, rate: 99.97, decimals: 2,
      metric: 'pass', metricLabel: '一次合格率', target: 99.7, mode: 'daily',
      source: '组件抽检巡检单', activeDays: 13, medianQty: 190, noDenomDefect: 0, lowSample: false,
      spark:     [  100,  100,  100,  100,99.51,  100,  100,  100, null,  100,  100,  100,  100,  100],
      sparkQty:  [  114,  127,  180,  191,  206,  194,  302,  143,    0,  286,  186,  190,  321,  626],
      sparkThin: [false,false,false,false,false,false,false,false,false,false,false,false,false,false] },
    { name: '成品改型', qty: 918, defect: 16, rate: 98.3,
      metric: 'yield', metricLabel: '一次合格率', target: 96, mode: 'daily',
      activeDays: 11, medianQty: 93, noDenomDefect: 0, lowSample: false,
      spark:     [ 99.2, 97.5, 99.2, 96.7, null, 96.8, 99.2, 94.4, 99.3, 94.6, 97.2, null, 98.1, null],
      sparkQty:  [  130,   79,  128,   30,    0,   93,  127,  125,  135,   74,   36,    0,   52,    0],
      sparkThin: [false, true,false, true,false,false,false,false,false, true, true,false,false,false] },
    // 这张卡的 08-03：只检了 2 件、坏 2 件 → 0%。共用纵轴时它会把其余所有线
    // 压成一条平线 —— sparse 卡不画图，正是为了这种点
    { name: '硬币清分机', qty: 136, defect: 15, rate: 89,
      metric: 'yield', metricLabel: '一次合格率', target: 92, mode: 'sparse',
      activeDays: 7, medianQty: 25, noDenomDefect: 0, lowSample: false,
      spark:     [ null,  100, null, null, null, null, 96.7, 87.5, 83.3,   90, null, null,    0, null],
      sparkQty:  [    0,   20,    0,    0,    0,    0,   30,   32,   30,   20,    0,    0,    2,    0],
      sparkThin: [false, true,false,false,false,false, true, true, true, true,false,false, true,false] },
  ],
  // 流水三环节，表格视图用。电检是瓶颈：合格率最低，检验量还不到另两个环节的一半

    { id: 'electrical', label: '电检',   qty:  607, defect: 81, rate: 86.7 },

  ],
  flowFpy: 82.4,
  // 产品维度只进表格视图，不占主视觉 —— 「哪条线拖后腿」由上面三张卡回答
  groups: [
    { name: 'BCS-160A',    qty: 1420, defect: 61, rate: 95.7,
      spark: [95.2,96.0,97.1,96.4,null,95.1,96.3,95.0,93.8,94.5,91.2,null,97.0,null] },
    { name: 'HCS-3300',    qty: 986,  defect: 34, rate: 96.6,
      spark: [96.9,96.5,97.4,97.2,null,95.8,96.4,96.1,94.9,95.6,93.1,null,97.8,null] },
    { name: '点钞机半制品', qty: 604,  defect: 29, rate: 95.2,
      spark: [94.1,95.3,96.0,95.5,null,94.2,95.1,94.6,92.8,93.4,89.9,null,96.2,null] },
    { name: 'VS-75(M165)', qty: 512,  defect: 18, rate: 96.5,
      spark: [97.2,96.8,97.0,96.1,null,96.4,96.9,95.8,96.2,95.9,94.7,null,97.5,null] },
    { name: 'BC-30',       qty: 348,  defect: 12, rate: 96.6,
      spark: [96.5,97.0,96.8,null,null,96.2,97.1,96.0,96.4,95.7,null,null,97.2,null] },
    { name: 'HCS-2100',    qty: 266,  defect: 7,  rate: 97.4,
      spark: [97.8,97.2,98.0,97.5,null,96.9,97.6,97.1,96.8,97.0,null,null,98.1,null] },
  ],
  crossCheck: null,
  counts: null,
};

async function loadQuality() {
  const res = await fetch('/api/quality', { cache: 'no-store' });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const err = new Error(body.error || ('HTTP ' + res.status));
    err.needSetup = Boolean(body.needSetup);   // 「没配账号」和「连不上」是两回事
    throw err;
  }
  return res.json();
}

// ═══════════════════════════════════════════════════════════════
// 良品率状态判定
// 三档，每档配「不同形状」的图标 + 文字 —— 红绿色盲看不出红绿差别，
// 形状和文字才是可靠通道，颜色只是辅助
// ═══════════════════════════════════════════════════════════════
const GRADE = {
  good:     { icon: '●', text: '达标', color: 'var(--good)'     },
  warning:  { icon: '◆', text: '预警', color: 'var(--warning)'  },
  critical: { icon: '■', text: '超标', color: 'var(--critical)' },
};
const gradeOf = (rate, target) =>
  rate >= target ? 'good' : rate >= target - 1.5 ? 'warning' : 'critical';

// 纵轴范围：良品率挤在 96–99 之间，从 0 起画会是一条直线。
// 折线图允许截断纵轴（柱状图不允许 —— 柱长就是数值）
//
// floor：纵轴最低必须画到这个刻度（默认 90%），这样「离 90 还有多远」
// 在图上是同一把尺子，不会因为某周数据好就自动放大成一条平线。
// 数据真跌破 floor 时继续往下让 —— 否则点会画到坐标区外面，
// 标红的日期反而指向一个看不见的点。
// 不传 floor 就按数据自适应：类型小倍数图共用一套刻度，强行下压会把三张卡压扁
function rateScale(values, target, floor) {
  const nums = values.filter(v => typeof v === 'number');
  let lo = Math.floor(Math.min(...(nums.length ? nums : [target]), target) - 0.5);
  if (typeof floor === 'number') lo = Math.min(lo, floor);
  return { lo: Math.max(0, lo), hi: 100 };   // 良品率没有负数，留一手防出现 0% 的日子把轴拉到 -1
}

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

// ═══════════════════════════════════════════════════════════════
// 主图：良品率按日折线
// ═══════════════════════════════════════════════════════════════
function renderTrend(data) {
  const svg = document.getElementById('trend');
  svg.textContent = '';

  const W = 1200, H = 300, padL = 74, padR = 96, padT = 26, padB = 42;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const pts = data.series;
  if (!pts.length) return;

  const floor = typeof data.rateFloor === 'number' ? data.rateFloor : 90;
  const { lo, hi } = rateScale(pts.map(p => p.rate), data.target, floor);
  const x = i => padL + (pts.length === 1 ? plotW / 2 : i * plotW / (pts.length - 1));
  const y = v => padT + plotH - (v - lo) / (hi - lo) * plotH;
  const hasVal = i => typeof pts[i].rate === 'number';
  const weakAt = i => pts[i].output > 0 && pts[i].output < data.minSample;
  const belowFloor = i => hasVal(i) && pts[i].rate < floor;

  // 网格：发丝实线，比数据弱一档（虚线会被读成「阈值」）
  const gridStep = (hi - lo) > 8 ? 2 : 1;
  for (let v = lo; v <= hi; v += gridStep) {
    svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(v), y2: y(v),
      stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.appendChild(el('text', { x: padL - 12, y: y(v) + 6, 'text-anchor': 'end',
      fill: 'var(--ink-muted)', 'font-size': 17, 'font-variant-numeric': 'tabular-nums' }, v + '%'));
  }

  // 这条线是全厂合计的**参考线**，不是 KPI —— 考核表的质量类只有四项，
  // 没有「全厂合计」这一档，96.5 是推算出来的。写成「目标」会让人以为
  // 全厂有考核线，进而拿它去判达标。真正的目标线在下面四张卡上，
  // 那些才有考核表撑着。
  svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(data.target), y2: y(data.target),
    stroke: 'var(--warning)', 'stroke-width': 2, 'stroke-dasharray': '8 6', 'stroke-linecap': 'round' }));
  svg.appendChild(el('text', { x: padL + 4, y: y(data.target) - 10,
    fill: 'var(--ink-2)', 'font-size': 17 },
    (data.targetIsKpi === false ? '参考 ' : '目标 ') + data.target + '%'));

  // 不画面积填充：纵轴是截断的，面积会把「离基线多远」说成「有多少」

  // 折线 2px。没有检验记录的日子（周末、停产）直接断开 —— 补 0 会画出
  // 一条冲到底的假曲线，那是数据里没有的事
  for (let i = 1; i < pts.length; i++) {
    if (!hasVal(i) || !hasVal(i - 1)) continue;
    const weak = weakAt(i) || weakAt(i - 1);
    svg.appendChild(el('path', {
      d: `M${x(i - 1)},${y(pts[i - 1].rate)} L${x(i)},${y(pts[i].rate)}`,
      fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: weak ? 0.35 : 1,
    }));
  }

  // 数据点 8px，2px 表面色环，压线时也看得清
  pts.forEach((p, i) => {
    if (!hasVal(i)) return;
    const weak = weakAt(i);
    svg.appendChild(el('circle', { cx: x(i), cy: y(p.rate), r: 4,
      fill: weak ? 'var(--surface)' : 'var(--series-1)',
      stroke: weak ? 'var(--series-1)' : 'var(--surface)',
      'stroke-width': 2, opacity: weak ? 0.6 : 1 }));
  });

  // 直接标注只标两个：末点和最低点。每点都标等于没标
  const idx = pts.map((_, i) => i).filter(hasVal);
  if (idx.length) {
    const last = idx[idx.length - 1];
    const low = idx.reduce((b, i) => pts[i].rate < pts[b].rate ? i : b, idx[0]);
    const tag = (i, anchor, dy) => svg.appendChild(el('text', {
      x: x(i) + (anchor === 'start' ? 10 : 0), y: y(pts[i].rate) + dy,
      'text-anchor': anchor, fill: 'var(--ink)', 'font-size': 21, 'font-weight': 600,
      'font-variant-numeric': 'tabular-nums',
    }, pts[i].rate.toFixed(1) + '%'));
    if (low !== last) tag(low, 'middle', 30);
    tag(last, 'start', 6);
  }

  svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: padT + plotH, y2: padT + plotH,
    stroke: 'var(--axis)', 'stroke-width': 1 }));
  // 日期多的时候隔一个标一个，免得挤成一坨。
  // 未达 floor 的日子是例外，一定要标出来 —— 被隔一个跳掉就等于没有提示
  const every = pts.length > 16 ? 2 : 1;
  pts.forEach((p, i) => {
    if (i % every !== 0 && i !== pts.length - 1 && !belowFloor(i)) return;
    const bad = belowFloor(i);
    svg.appendChild(el('text', { x: x(i), y: padT + plotH + 28, 'text-anchor': 'middle',
      fill: bad ? 'var(--critical)' : 'var(--ink-muted)',
      'font-size': 17, 'font-weight': bad ? 700 : 400,
      'font-variant-numeric': 'tabular-nums',
      // 样本不足仍旧压暗，但压得比常规轻：这天既「不达标」又「不可靠」，
      // 两个信息都要留住，不能让 0.55 把红色弱化到看不出来
      opacity: bad ? (weakAt(i) ? 0.7 : 1) : (hasVal(i) ? (weakAt(i) ? 0.55 : 1) : 0.4),
    }, p.t));
  });

  // 纵轴不从 0 起必须说明，否则会被读成「良品率快掉到底了」。
  // 标红是新增的约定，同样得在图上讲清楚，不能让人猜
  svg.appendChild(el('text', { x: padL, y: 16, fill: 'var(--ink-muted)', 'font-size': 15 },
    `纵轴 ${lo}–${hi}%（非零起点）· 空心点＝当日检验数不足 ${data.minSample} 件，比率仅供参考 · 断开＝当日无检验记录 · 日期标红＝当日良品率低于 ${floor}%`));
}

// ═══════════════════════════════════════════════════════════════
// 副图：每日不良品数
//
// 不和良品率画在一张图上（双纵轴）：两轴怎么对齐全凭主观，
// 图会「造」出数据里根本没有的相关性。拆成上下两张，共用时间轴
// ═══════════════════════════════════════════════════════════════
function renderDefects(data) {
  const svg = document.getElementById('defects');
  svg.textContent = '';

  const W = 1200, H = 190, padL = 74, padR = 96, padT = 16, padB = 42;  // 左右与主图一致，两图 x 对齐
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const pts = data.series;
  if (!pts.length) return;

  const raw = Math.max(...pts.map(p => p.defect), 1);
  const step = raw <= 10 ? 2 : raw <= 30 ? 10 : raw <= 100 ? 25 : 50;
  const hi = Math.ceil(raw / step) * step;      // 柱状图纵轴必须从 0 起
  const slot = plotW / pts.length;
  const bw = Math.max(4, Math.min(24, slot - 10));   // 柱不占满槽位，留空气；≤24px
  const x = i => padL + slot * (i + 0.5);
  const y = v => padT + plotH - v / hi * plotH;

  for (let v = 0; v <= hi; v += step) {
    svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(v), y2: y(v),
      stroke: v === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
    svg.appendChild(el('text', { x: padL - 12, y: y(v) + 6, 'text-anchor': 'end',
      fill: 'var(--ink-muted)', 'font-size': 17, 'font-variant-numeric': 'tabular-nums' }, v));
  }

  const every = pts.length > 16 ? 2 : 1;
  pts.forEach((p, i) => {
    if (p.output > 0 && p.defect > 0) {
      const r = Math.min(4, bw / 2);
      // 数据端 4px 圆角、基线端方角，从同一条基线长出来
      svg.appendChild(el('path', {
        d: `M${x(i) - bw/2},${padT + plotH} L${x(i) - bw/2},${y(p.defect) + r}
            Q${x(i) - bw/2},${y(p.defect)} ${x(i) - bw/2 + r},${y(p.defect)}
            L${x(i) + bw/2 - r},${y(p.defect)}
            Q${x(i) + bw/2},${y(p.defect)} ${x(i) + bw/2},${y(p.defect) + r}
            L${x(i) + bw/2},${padT + plotH} Z`.replace(/\s+/g, ' '),
        fill: 'var(--series-1)',
        opacity: p.output < data.minSample ? 0.45 : 1,
      }));
    }
    if (i % every !== 0 && i !== pts.length - 1) return;
    svg.appendChild(el('text', { x: x(i), y: padT + plotH + 28, 'text-anchor': 'middle',
      fill: 'var(--ink-muted)', 'font-size': 17, 'font-variant-numeric': 'tabular-nums',
      opacity: p.output > 0 ? (p.output < data.minSample ? 0.55 : 1) : 0.4 }, p.t));
  });

  const peak = pts.reduce((b, p, i) => p.defect > pts[b].defect ? i : b, 0);
  if (pts[peak].defect > 0) {
    svg.appendChild(el('text', { x: x(peak), y: y(pts[peak].defect) - 12, 'text-anchor': 'middle',
      fill: 'var(--ink)', 'font-size': 21, 'font-weight': 600,
      'font-variant-numeric': 'tabular-nums' }, pts[peak].defect));
  }
}

// ═══════════════════════════════════════════════════════════════
// 小倍数：每个生产类型一张迷你折线
//
// 分组维度是「检验类型」（流水生产 / 成品改型 / 清分机），不是产品代码。
// 理由：两个接口都有这个字段，分子分母能对齐；而且它回答的正是班组长
// 真正要问的那句「哪条线拖的后腿」。产品维度退到表格视图，信息没丢。
//
// 所有小图共用同一个纵轴范围。各画各的范围会让所有线看起来一样陡，
// 那是在骗人。
//
// 但共用纵轴有个前提：参与定标的点得是可信的。实测清分机有过「当天检 2 件、
// 坏 2 件 → 0%」的点，让它参与定标会把其余两条线压成平线。所以：
//   · 定标只用**样本量达标**的点（低于 minSample 的点画得出来，但不定标）
//   · 整个类型都撑不起趋势的（mode: 'sparse'），干脆不画图 ——
//     点是实测到的事实，线是我们编出来的，编不出来就别编
// ═══════════════════════════════════════════════════════════════
function renderTypes(data) {
  const box = document.getElementById('sparks');
  box.textContent = '';
  const types = data.types || [];
  if (!types.length) {
    box.innerHTML = '<div class="spark-status">区间内没有可分组的检验数据</div>';
    return;
  }

  // 定标：只取画得出趋势的卡片里样本量达标的点，外加每张卡自己的目标线
  const scaleVals = [];
  types.forEach(t => {
    if (typeof t.target === 'number') scaleVals.push(t.target);
    if (t.mode === 'sparse') return;
    t.spark.forEach((v, i) => {
      const thin = t.sparkThin ? t.sparkThin[i] : (() => {
        const q = (t.sparkQty || [])[i];
        return q !== undefined && q > 0 && q < data.minSample;
      })();
      if (typeof v === 'number' && !thin) scaleVals.push(v);
    });
  });
  const { lo, hi } = rateScale(scaleVals, data.target);

  types.forEach(t => {
    // 目标线可能没有（该年的 KPI 还没配）。**不能退回 data.target** ——
    // 那是全厂的推算参考线，拿它当某条产线的 KPI 就是编一个数出来。
    // 没有就是没有，下面卡片显示「目标未设」、不判达标、不画虚线。
    const target = typeof t.target === 'number' ? t.target : null;
    // 大数字用整个区间的率 —— 面板标题写的是多少天，数字就得是多少天的。
    // 取最后一天会被小样本带偏
    const cur = typeof t.rate === 'number' ? t.rate : null;
    const grade = (cur === null || target === null) ? null : GRADE[gradeOf(cur, target)];

    const card = document.createElement('div');
    card.className = 'spark-card';

    const head = document.createElement('div');
    head.className = 'spark-head';
    const nm = document.createElement('span');
    nm.className = 'spark-name';
    // 指标名必须写在卡上。四张卡不是同一个指标 —— 流水是一次直通率、
    // 组件是抽检一次合格率、改型和清分机是一次合格率。不标出来，读者会拿
    // 四个不可比的数横向比较，而且「82.4% 的流水」看着比「98.3% 的改型」
    // 差得多，其实是两把不同的尺子。
    // 「一次」两个字是考核表的原话（first-pass），少了会被读成最终合格率
    nm.textContent = t.metricLabel ? `${t.name} · ${t.metricLabel}` : t.name;
    nm.title = t.source ? `${t.name}（${t.metricLabel}，来源：${t.source}）` : nm.textContent;
    const rt = document.createElement('span');
    rt.className = 'spark-rate';
    rt.textContent = cur === null ? '—' : cur.toFixed(t.decimals || 1) + '%';
    head.append(nm, rt);
    card.appendChild(head);

    if (t.mode === 'sparse') {
      // 样本撑不起趋势：写清楚为什么，不画任何几何图形。
      // 画一条由 6 个点连成的线，读者会当成趋势去读，那是无中生有
      const none = document.createElement('div');
      none.className = 'spark-none';
      none.textContent =
        `近 ${data.series.length} 天仅 ${t.qty.toLocaleString('zh-CN')} 件、${t.activeDays} 天有检验，`
        + `日均不足 ${data.minSample} 件，画趋势线是在把噪声当信号。逐日值见下方表格视图。`;
      card.appendChild(none);
    } else {
      card.appendChild(buildSpark(t, target, lo, hi, data, cur, grade));
    }

    const st = document.createElement('div');
    st.className = 'spark-status';
    if (!grade && target === null && cur !== null) {
      // 有数、但没有 KPI 可比。把原因写出来，否则「无数据」会被理解成
      // 「这条线今天没生产」，那是完全不同的一件事
      st.textContent = `${t.qty.toLocaleString('zh-CN')} 件 · 本年目标未设，不判达标`;
    } else if (grade) {
      const dot = document.createElement('span');
      dot.style.color = grade.color;
      dot.textContent = grade.icon;
      const tx = document.createElement('span');
      // 检验量也写出来：光看比率不知道它建立在多少件上
      tx.textContent = t.lowSample
        ? `${grade.text}（仅 ${t.qty} 件，样本不足）`
        : `${grade.text} · ${t.qty.toLocaleString('zh-CN')} 件`;
      st.append(dot, tx);
    } else {
      st.textContent = '无数据';
    }
    card.appendChild(st);

    // 各卡目标线不同，必须逐卡写出来 —— 否则三条虚线高度不一，
    // 读者会以为是数据在动
    const tg = document.createElement('div');
    tg.className = 'spark-target';
    tg.textContent = (target === null ? '目标未设' : `目标 ${target}%`)
      + (t.noDenomDefect ? ` · ${t.noDenomDefect} 件不良当天无日报，未计入` : '');
    card.appendChild(tg);

    box.appendChild(card);
  });
}

function buildSpark(t, target, lo, hi, data, cur, grade) {
  const W = 240, H = 56, padT = 6, padB = 6;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': `${t.name}${t.metricLabel || '一次合格率'}趋势，`
                  + `区间 ${cur === null ? '无数据' : cur.toFixed(t.decimals || 1) + '%'}`
                  + `${grade ? '，' + grade.text : ''}`
                  + `，${target === null ? '本年目标未设' : '目标 ' + target + '%'}` });
  const x = i => t.spark.length === 1 ? W / 2 : i * W / (t.spark.length - 1);
  // 定标排除了小样本点，个别点会落到轴外 —— 夹回画布内，否则会画到卡片外面去。
  // 夹过的点仍然画成空心，读者知道它不可信，具体数值在表格视图里
  const y = v => {
    const raw = padT + (H - padT - padB) - (v - lo) / (hi - lo) * (H - padT - padB);
    return Math.max(padT, Math.min(H - padB, raw));
  };
  const weakAt = i => {
    // 服务端算好的：流水按**环节**判小样本，其余按当日总量。
    // 实测有「当天流水共 186 件、但电检只做了 15 件」把直通率拉到 43.78%
    // 的日子，按总量判它是达标样本，那个点会被实心画出来
    if (t.sparkThin) return Boolean(t.sparkThin[i]);
    const q = (t.sparkQty || [])[i];
    return q !== undefined && q > 0 && q < data.minSample;
  };

  // 小图里也保留目标线，否则读者没有判断高低的锚点。
  // 该年 KPI 没配时不画 —— 画一条位置全凭兜底值决定的虚线，
  // 比不画更误导：读者会拿它当基准去读高低
  if (target !== null) {
    svg.appendChild(el('line', { x1: 0, x2: W, y1: y(target), y2: y(target),
      stroke: 'var(--warning)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4', opacity: .75 }));
  }

  for (let i = 1; i < t.spark.length; i++) {
    if (typeof t.spark[i] !== 'number' || typeof t.spark[i - 1] !== 'number') continue;
    svg.appendChild(el('path', {
      d: `M${x(i - 1)},${y(t.spark[i - 1])} L${x(i)},${y(t.spark[i])}`,
      fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      opacity: (weakAt(i) || weakAt(i - 1)) ? 0.35 : 1 }));
  }

  // 小样本点画空心，和主图一个规矩
  t.spark.forEach((v, i) => {
    if (typeof v !== 'number' || !weakAt(i)) return;
    svg.appendChild(el('circle', { cx: x(i), cy: y(v), r: 3,
      fill: 'var(--surface)', stroke: 'var(--series-1)', 'stroke-width': 1.5, opacity: .6 }));
  });

  const lastIdx = t.spark.reduce((b, v, i) => typeof v === 'number' ? i : b, -1);
  if (lastIdx >= 0) {
    svg.appendChild(el('circle', { cx: x(lastIdx), cy: y(t.spark[lastIdx]), r: 4,
      fill: weakAt(lastIdx) ? 'var(--surface)' : 'var(--series-1)',
      stroke: weakAt(lastIdx) ? 'var(--series-1)' : 'var(--surface)', 'stroke-width': 2 }));
  }
  return svg;
}

// ═══════════════════════════════════════════════════════════════
// 表格视图 —— 每张图的等价物。大屏上折叠着，但值永远拿得到，
// 不会出现「只有把鼠标悬上去才能读到数」的情况（大屏根本没鼠标）
// ═══════════════════════════════════════════════════════════════
function renderTable(data) {
  const days = data.series.map(p => `<th>${p.t}</th>`).join('');
  const fmt = v => typeof v === 'number' ? v.toFixed(1) : '—';
  const dim = p => p.output > 0 && p.output < data.minSample ? ' style="color:var(--ink-muted)"' : '';

  document.getElementById('tableView').innerHTML = `
    <table>
      <thead><tr><th>日期</th>${days}</tr></thead>
      <tbody>
        <tr><td>检验数（件）</td>${data.series.map(p => `<td>${p.output.toLocaleString('zh-CN')}</td>`).join('')}</tr>
        <tr><td>不良数（件）</td>${data.series.map(p => `<td>${p.defect.toLocaleString('zh-CN')}</td>`).join('')}</tr>
        <tr><td>良品率（%）</td>${data.series.map(p => `<td${dim(p)}>${fmt(p.rate)}</td>`).join('')}</tr>
      </tbody>
    </table>
    ${(data.types || []).length ? `
    <table>
      <thead><tr><th>生产类型</th><th>指标</th>${days}<th>区间</th><th>目标</th><th>状态</th></tr></thead>
      <tbody>
        ${data.types.map(t => {
          // 同卡片：没配 KPI 就不比，不拿全厂参考线顶上
          const tg = typeof t.target === 'number' ? t.target : null;
          const gr = (typeof t.rate === 'number' && tg !== null) ? GRADE[gradeOf(t.rate, tg)] : null;
          // sparse 卡片在图上没有折线，逐日值只能在这里读到 —— 这张表是它的唯一出口
          return `<tr><td>${t.name}</td><td>${t.metricLabel || '一次合格率'}</td>${t.spark.map((v, i) => {
            // 小样本判定用服务端给的 sparkThin：流水是按**环节**判的，
            // 拿当日总量判会漏掉「总量 186 件但电检只有 15 件」那种日子
            const weak = (t.sparkThin || [])[i];
            return `<td${weak ? ' style="color:var(--ink-muted)"' : ''}>${fmt(v)}</td>`;
          }).join('')}<td>${fmt(t.rate)}</td><td>${tg === null ? '未设' : tg}</td><td>${gr ? gr.icon + ' ' + gr.text : '—'}</td></tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="spark-target" style="margin-top:.6em">
      淡色＝当日样本不足 ${data.minSample} 件，比率仅供参考（流水按各环节分别判定）
    </div>` : ''}
    ${(data.flowStages || []).length ? `
    <table>
      <thead><tr><th>流水环节</th><th>检验数</th><th>不良数</th><th>合格率（%）</th></tr></thead>
      <tbody>
        ${data.flowStages.map(s => `<tr><td>${s.label}</td>` +
          `<td>${(s.qty || 0).toLocaleString('zh-CN')}</td><td>${(s.defect || 0).toLocaleString('zh-CN')}</td>` +
          `<td>${fmt(s.rate)}</td></tr>`).join('')}
        <tr><td><strong>直通率</strong></td><td colspan="2">三环节相乘</td><td><strong>${fmt(data.flowFpy)}</strong></td></tr>
      </tbody>
    </table>
    <div class="spark-target" style="margin-top:.6em">
      直通率 ＝ 电检合格率 × 装配检合格率 × 流水检合格率；互检无分母，不参与计算
    </div>` : ''}
    ${(data.groups || []).length ? `
    <table>
      <thead><tr><th>产品</th>${days}<th>区间</th><th>件数</th></tr></thead>
      <tbody>
        ${data.groups.map(g => `<tr><td>${g.name}</td>${g.spark.map(v => `<td>${fmt(v)}</td>`).join('')}` +
          `<td>${fmt(g.rate)}</td><td>${(g.qty || 0).toLocaleString('zh-CN')}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="spark-target" style="margin-top:.6em">
      产品维度按检验量取前 ${data.groups.length} 位。「哪条线拖后腿」看上面的生产类型表，
      这张回答的是「哪个机型不良多」
    </div>` : ''}`;
}

// ═══════════════════════════════════════════════════════════════
// 渲染入口
// ═══════════════════════════════════════════════════════════════
function render(data) {
  const s = data.summary;

  document.getElementById('range').textContent = data.range || '';
  document.getElementById('trendSub').textContent =
    `${data.series.length} 天 · 按日（数据源只到天，没有更细的粒度）`;
  const typeCount = (data.types || []).length;
  const sparse = (data.types || []).filter(t => t.mode === 'sparse').length;
  // 考核表的公式是「当月合格数量/总数量」，这里是 N 天滚动窗口 ——
  // 跨月时两个数不一样，不写明会被当成考核数往上报
  document.getElementById('groupSub').textContent =
    `${typeCount} 个类型 · 共用同一纵轴，形状可直接互比 · 目标线为季度 KPI`
    + (sparse ? `（其中 ${sparse} 个样本不足，只给区间值不画趋势）` : '')
    + ` · 区间为滚动 ${data.series.length} 天，考核按当月累计，两者不等价`;
  document.getElementById('rateLabel').textContent =
    s.latestDate ? `${s.latestDate} 良品率` : '最新一日良品率';

  if (typeof s.rate === 'number') {
    document.getElementById('figRate').textContent = s.rate.toFixed(1);
    // 顶部这个数是全厂合计（接口 5 全量，1 − 不良数 ÷ 检验数），**不是考核指标**：
    // 考核表的质量类是四条线各自的一次合格率/直通率，没有全厂这一档，
    // 而且四条线口径互不相同，合起来的数本就不该拿一条推算线打红绿灯。
    // 以前这里显示「达标/未达标（目标 96.5%）」，是个假的红绿灯。
    document.getElementById('figStatus').innerHTML = data.targetIsKpi === false
      ? `<span>全厂合计 · 非考核指标（各线 KPI 见下方卡片）</span>`
      : (() => { const g = GRADE[gradeOf(s.rate, data.target)];
          return `<span style="color:${g.color}">${g.icon}</span><span>${g.text}（目标 ${data.target}%）</span>`; })();
  } else {
    document.getElementById('figRate').textContent = '--';
    document.getElementById('figStatus').textContent = '当日无检验数据';
  }

  // 方向由箭头字符承担，颜色只是加强
  const dl = document.getElementById('figDelta');
  if (typeof s.rateDelta === 'number') {
    const up = s.rateDelta >= 0;
    dl.innerHTML = `<span style="color:${up ? 'var(--good)' : 'var(--critical)'}">${up ? '↑' : '↓'}</span> ` +
      `${Math.abs(s.rateDelta).toFixed(1)} 个百分点 · 较${s.deltaBase}` +
      (typeof s.periodRate === 'number' ? ` · 区间累计 ${s.periodRate.toFixed(1)}%` : '');
  } else dl.textContent = '';

  document.getElementById('figDefect').textContent = (s.defect || 0).toLocaleString('zh-CN');
  const ddl = document.getElementById('figDefectDelta');
  if (typeof s.defectDelta === 'number') {
    const up = s.defectDelta >= 0;
    ddl.innerHTML = `<span style="color:${up ? 'var(--critical)' : 'var(--good)'}">${up ? '↑' : '↓'}</span> ` +
      `${Math.abs(s.defectDelta)} 件 · 较${s.deltaBase}`;
  } else ddl.textContent = '';

  renderTrend(data);
  renderDefects(data);
  renderTypes(data);
  renderTable(data);

  // 分子分母不同源的风险要显式暴露，不能静默地错。
  // 目标线缺失排在它前面 —— 那是「这块屏现在判不了达标」，比口径偏差更要紧
  const warn = document.getElementById('bannerWarn');
  const missing = data.targetYearsMissing || [];
  if (missing.length) {
    warn.textContent = `◆ ${missing.join('、')} 年的目标线还没设，这些日子不画目标线也不判达标。`
      + `考核表一年一发，请在 config.json 的 targets 里补上「${missing[0]}」那一档。`;
    warn.classList.add('show');
  } else if (data.crossCheck && !data.crossCheck.ok) {
    warn.textContent = '◆ 口径提示：' + data.crossCheck.note;
    warn.classList.add('show');
  } else warn.classList.remove('show');

  document.getElementById('source').textContent = data.counts
    ? `日报 ${data.counts.日报记录} 条 / 异常 ${data.counts.异常记录} 条`
    : '示例数据';
  document.getElementById('lastUpdate').textContent =
    '最后更新 ' + new Date(data.updatedAt).toLocaleTimeString('zh-CN');
}

// ═══════════════════════════════════════════════════════════════
// 拉数据：连续失败才报警（一次网络抖动不弹提示，避免误报），
// 并明确写出「当前显示的是多久以前的旧数据」——
// 看板最危险的不是黑屏，是挂着两小时前的数字还没人发现
// ═══════════════════════════════════════════════════════════════
let failCount = 0, lastOkTime = null;

async function load() {
  try {
    const data = await loadQuality();
    render(data);
    failCount = 0;
    lastOkTime = Date.now();
    document.getElementById('bannerErr').classList.remove('show');
  } catch (err) {
    console.error('获取质量数据失败:', err);

    // 还没配 OA 账号 —— 这不是故障，是没装完。说清楚该去哪，别报成连接异常
    if (err.needSetup) {
      failCount = 0;
      render({ ...DEMO, range: '示例数据（尚未配置 OA 账号）' });
      const b = document.getElementById('bannerErr');
      // 这里用 innerHTML 是因为要塞一个链接，且整段文案全是写死的常量，
      // 没有任何来自接口或用户的内容。下面那条报错横幅带 err.message，
      // 那个必须继续用 textContent
      b.innerHTML = '◆ 还没配置 OA 账号，下面显示的是示例数据。'
        + '请在电脑上打开 <a href="/setup">账号配置页</a> 登录一次'
        + '（只需一次，之后大屏一直用这个账号取数）。';
      b.classList.add('show');
      return;
    }

    failCount++;
    if (lastOkTime === null && failCount === 1) {
      // 没有后端（比如直接双击打开文件）→ 用示例数据把版面显示出来
      render(DEMO);
      return;
    }
    if (failCount >= 2) {
      const stale = lastOkTime
        ? `，页面显示的是 ${Math.round((Date.now() - lastOkTime) / 1000)} 秒前的旧数据`
        : '';
      const b = document.getElementById('bannerErr');
      b.textContent = `■ 数据连接异常（已连续失败 ${failCount} 次：${err.message}）${stale}`;
      b.classList.add('show');
    }
  }
}

// 双击打开看板时地址栏是 file://，/setup 这个相对链接会指向 file:///setup —— 死链。
// 能双击打开就说明人在本机，改写成服务地址即可（端口跟着 server.js 的 PORT 走）。
// 正常通过 http 打开时不动它：那时相对路径本来就是对的，而且比写死 localhost 更对 ——
// 大屏走的是服务器内网 IP，写死会把人送到大屏自己那台机器上
if (location.protocol === 'file:') {
  for (const a of document.querySelectorAll('a[href="/setup"]')) {
    a.href = 'http://localhost:3200/setup';
  }
}

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN');
}
tickClock();
setInterval(tickClock, 1000);

load();
setInterval(load, 60000);   // 数据源是按日的，没必要 3 秒一刷
</script>
</body>
</html>
