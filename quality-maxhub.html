<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, must-revalidate">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>质量趋势</title>
<style>
  /* ═══════════════════════════════════════════════════════════
     MAXHUB 车间大屏版 —— 由 quality.html 改造，口径与设计决策一字未动，
     只做安卓浏览器适配：
       1. 排版从 clamp()+vw 改为「根字号缩放 + 定尺布局」，见 fit()
       2. 全部 flex gap 改成 margin
       3. 时间/千分位手写，不用 toLocale*
       4. 服务器地址可配（相对路径优先），见 resolveServer()
       5. 和服务端对表，平板时钟错了会报出来，见 checkClock()

     兼容基线：Chromium 49（覆盖 Android 6 起的所有 MAXHUB）
     刻意避开：flex gap(84) / clamp(79) / :where(88) / inset(87) /
              @container(105) / flatMap(69) / 对象展开(60) / append(54)
     ═══════════════════════════════════════════════════════════ */

  /* 配色 —— 与生产看板同一套 token，暗色单主题
     车间大屏常年长亮，暗背景眩光小、夜班不刺眼 */
  :root {
    --plane:     #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #898781;
    --hairline:  rgba(255,255,255,0.10);

    /* 图表专用：网格与轴要比数据弱一档，永远是实线 */
    --grid:      #2c2c2a;
    --axis:      #383835;

    /* 序列色只有一个 —— 见设计方案「为什么不给不良品数单独配色」 */
    --series-1:  #3987e5;

    /* 状态色：固定四档，只表示状态，绝不当序列色用 */
    --good:      #0ca30c;
    --warning:   #fab219;
    --critical:  #d03b3b;
  }

  * { box-sizing: border-box; }

  html {
    font-size: 16px;              /* JS 会按视口覆盖，见 fit() */
    background: var(--plane);
    overscroll-behavior: none;    /* 关下拉刷新：手指往下一划就重载页面 */
    touch-action: manipulation;   /* 关双击缩放 */
  }

  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    /* Android 上原字体栈前四个都不存在，真正命中的是 Noto/思源。
       把它们提前，避免数字走 Roboto、汉字走 Noto 的混排基线不齐 */
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Droid Sans Fallback",
                 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;   /* 触摸不闪蓝框 */
    -webkit-touch-callout: none;                /* 长按不弹「复制/搜索」 */
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
  }

  /* 设计基准 1920×1080，1rem = 16 设计像素。
     不用 vh —— 安卓地址栏会让 100vh 算错，而且滚动时还会变 */
  .board {
    /* 宽度撑满而不是写死 120rem：根字号按 min(宽,高) 缩放，屏幕比 16:9 宽
       时缩放由高度决定，写死 120rem 就只有 120×(vh/1080) 那么宽，左右空出
       一截。改成 100% 让容器吃满视口，字号仍按 min 算，所以还是一屏装得下，
       只是横向铺开——卡片和图表变宽，字不拉伸变形。
       SVG 都是按 parentNode.clientWidth 实测后重算 viewBox 的，跟着就宽了 */
    width: 100%;
    min-height: 67.5rem;
    padding: 1.75rem;
  }

  /* ── 页眉 ─────────────────────────────────────────────── */
  .hd { display: flex; align-items: baseline; margin-bottom: 1rem; }
  .hd h1 { margin: 0; font-size: 2.2rem; font-weight: 600; letter-spacing: .04em; }
  .hd .range { font-size: 1.25rem; color: var(--ink-2); margin-left: 1.1rem; }
  .hd .clock {
    margin-left: auto;
    font-size: 1.9rem;
    color: var(--ink-2);
    /* 时钟每秒都在变，非等宽数字会让整串左右抖，五米外很显眼 */
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* ── 提示条：数据连接异常 / 口径对不上 ─────────────────── */
  .banner {
    display: none;
    padding: .65rem 1rem;
    border-radius: .4rem;
    font-size: 1.2rem;
    line-height: 1.5;
    margin-bottom: 1rem;
  }
  .banner.show { display: block; }
  .banner.err  { background: rgba(208,59,59,0.15);  border: 1px solid var(--critical); }
  .banner.warn { background: rgba(250,178,25,0.13); border: 1px solid var(--warning); }

  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: .6rem;
    padding: 1.25rem;
  }

  .label { font-size: 1.1rem; color: var(--ink-muted); margin-bottom: .45rem; }

  /* ── 上半：KPI + 两张主图 ─────────────────────────────── */
  .top { display: flex; align-items: stretch; }
  .kpis { width: 21rem; flex: none; margin-right: 1.25rem; display: flex; flex-direction: column; }
  .kpis .card:first-child { margin-bottom: 1.25rem; flex: 1 1 auto; }
  .panels { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .panels .card { margin-bottom: .9rem; }
  .panels .card:last-child { margin-bottom: 0; }

  /* 本页最大的数字，但仍比主看板的「今日总完成率」小一号 ——
     整个大屏体系里主数字只能有一个。
     大号数字用默认比例字形，tabular-nums 会显得松散 */
  .figure { font-size: 4rem; font-weight: 600; line-height: 1; }
  .figure .unit { font-size: .38em; font-weight: 500; color: var(--ink-2); margin-left: .1em; }
  .stat-value { font-size: 2.4rem; font-weight: 600; line-height: 1.1; }

  /* 状态标记：图标形状 + 文字，颜色只是辅助 */
  .status { font-size: 1.15rem; color: var(--ink-2); margin-top: .55rem; }
  .status .ic { margin-right: .35em; }
  .delta {
    font-size: 1rem; color: var(--ink-2); margin-top: .5rem;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  }
  .delta .ar { margin-right: .3em; }

  .panel-title { font-size: 1.15rem; font-weight: 500; margin: 0 0 .55rem; }
  .panel-title .sub { font-size: .86em; font-weight: 400; color: var(--ink-muted); margin-left: .8em; }

  /* 图的尺寸由 JS 量出来写死在 width/height 属性上 ——
     老 WebView 上 svg{height:auto} 会算出 0 或 150px */
  .plot { line-height: 0; }
  .plot svg { display: block; overflow: visible; }

  /* ── 下半：小倍数 ─────────────────────────────────────── */
  .groups { margin-top: 1.25rem; }
  .sparks { display: flex; flex-wrap: wrap; height: 100%; }
  /* 卡片也竖向 flex：图吃掉标题和状态行以外的全部高度，和放大页同一套办法。
     两页都把舞台填满，翻页时视觉重心才不会上下跳 */
  .spark-card { min-width: 0; margin-right: .9rem; display: flex; flex-direction: column; height: 100%; }
  .spark-card .plot, .spark-card .spark-none { flex: 1 1 auto; min-height: 0; }
  .spark-head { display: flex; align-items: baseline; min-width: 0; margin-bottom: .3rem; }
  .spark-name {
    font-size: 1.15rem; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .spark-rate {
    margin-left: auto; padding-left: .5em;
    font-size: 1.4rem; font-weight: 600; white-space: nowrap;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  }
  .spark-status { font-size: .95rem; color: var(--ink-2); margin-top: .3rem; }
  .spark-status .ic { margin-right: .35em; }
  /* 各类型的目标线不同，必须逐卡写出来 —— 三条虚线高度不一，
     不写清楚会被当成数据在动 */
  .spark-target { font-size: .85rem; color: var(--ink-muted); margin-top: .15rem; }

  /* 样本量撑不起趋势的类型：不画图，占位写明为什么。
     高度由 JS 按迷你图算出来写死（和 .plot 一样的理由：老 WebView 上
     百分比/auto 高度算不出来），这里只管排版 */
  .spark-none {
    display: flex; align-items: center;
    font-size: .9rem; color: var(--ink-muted); line-height: 1.4;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }

  /* ── 轮播：下半区放大显示单个生产类型 ──────────────────────
     上半的全厂 KPI 和趋势图常驻不动 —— 班组长抬头一眼要看到的是
     「现在够不够」，那个答案不能等轮播转到某一页才出现 */
  /* 舞台高度写死：并排页和放大页内容高度不同，不固定的话每翻一页
     fit() 都会按新的总高重算根字号，整块看板的字会跟着跳一下 ——
     五米外看就是屏幕在抽搐 */
  /* 表格常驻之后，逐日的精确数值由表格负责，图这边只承担「形状」这件事，
     所以舞台从 16rem 收回来一些，把高度让给表格。整块看板的总高是有预算的：
     超出一屏 fit() 就整体缩小，缩小是等比的 —— 高度超支会连带把宽度也浪费掉，
     两边留出大片黑边，五米外反而更难读 */
  .stage { height: 11.5rem; }
  /* 竖向 flex：图占掉标题和状态行之外的全部高度，具体多少像素由 JS 量出来
     再折算成 viewBox 比例（见 drawFocus）。写死高度的话，根字号一变就溢出，
     图会压到下面那行状态字上 —— 这个 bug 真出过 */
  .focus { display: none; height: 100%; }
  .focus.on { display: flex; flex-direction: column; }
  .focus .plot, .focus-none { flex: 1 1 auto; min-height: 0; }
  .focus-head { display: flex; align-items: baseline; margin-bottom: .35rem; flex: none; }
  .focus-meta { flex: none; }
  .focus-name { font-size: 1.8rem; font-weight: 600; }
  .focus-rate {
    margin-left: auto; font-size: 2.8rem; font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  }
  .focus-meta { font-size: 1.2rem; color: var(--ink-2); margin-top: .5rem; }
  .focus-meta .ic { margin-right: .35em; }
  /* 样本撑不起趋势的类型，放大页给的是这段话而不是图 */
  .focus-none {
    display: flex; align-items: center;
    font-size: 1.3rem; color: var(--ink-muted); line-height: 1.6;
    padding: 0 2rem;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: .5rem;
  }

  /* 页码圆点：让人知道「还有几页」「等多久轮回来」。
     没有这个，轮播在观众眼里就是屏幕自己在乱跳 */
  .dots { margin-left: auto; font-size: 1rem; color: var(--ink-muted); letter-spacing: .35em; }
  .dots .on { color: var(--ink); }
  .panel-title { display: flex; align-items: baseline; }

  /* ── 表格视图：每张图的等价物，不靠颜色传信息 ───────────
     大屏上**常驻展开**，不做折叠。折叠是给有鼠标的人准备的交互，
     而车间这块屏没有鼠标也没人操作 —— 藏起来的值等于不存在。
     代价是内容比一屏高，所以放进一个定高的盒子里自动上下滚。 */
  .table-view { margin-top: .6rem; }
  .tv-title { font-size: 1rem; color: var(--ink-muted); margin-bottom: .3rem; display: flex; }
  .tv-hint { margin-left: auto; }
  /* 定高 + 自己滚。高度写死是为了让整块看板的总高可预测，
     fit() 才算得准 —— 内容有多高都不会把看板顶出一屏 */
  .tv-box { height: 11rem; overflow: hidden; position: relative; }
  /* 上下两端各压一道渐隐，明示「上面/下面还有内容」。
     没有这个，滚到一半的表格看起来就像被裁掉了 */
  .tv-box::before, .tv-box::after {
    content: ""; position: absolute; left: 0; right: 0; height: 1.6rem;
    pointer-events: none; z-index: 1;
  }
  .tv-box::before { top: 0;    background: linear-gradient(to bottom, var(--surface), rgba(26,26,25,0)); }
  .tv-box::after  { bottom: 0; background: linear-gradient(to top,    var(--surface), rgba(26,26,25,0)); }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; margin-top: .5rem; font-size: 1rem; }
  th, td {
    padding: .45em .9em .45em 0;
    text-align: right;
    font-variant-numeric: tabular-nums;   /* 成列的数字必须对齐 */
    font-feature-settings: "tnum" 1;
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-muted); font-weight: 500; }

  .ft { margin-top: .9rem; font-size: .95rem; color: var(--ink-muted); display: flex; flex-wrap: wrap; }
  .ft span { margin-right: 1.5em; }

  /* 这里原来有一组链接样式，服务的是页脚那个「配置 OA 账号」入口。
     入口去掉之后整个页面一个 <a> 都没有了 —— 大屏是只读看板，本来也不该有
     任何可点的东西。样式一并删掉，别留着误导后来改这个文件的人。 */
</style>
</head>
<body>

<div class="board" id="board">

  <div class="hd">
    <h1>质量趋势</h1>
    <span class="range" id="range">—</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="banner err"  id="bannerErr"></div>
  <div class="banner warn" id="bannerWarn"></div>
  <div class="banner warn" id="bannerClock"></div>

  <div class="top">
    <div class="kpis">
      <div class="card">
        <div class="label" id="rateLabel">最新一日良品率</div>
        <div class="figure"><span id="figRate">--</span><span class="unit">%</span></div>
        <div class="status" id="figStatus"></div>
        <div class="delta" id="figDelta"></div>
      </div>
      <div class="card">
        <div class="label">当日不良品</div>
        <div class="stat-value"><span id="figDefect">--</span> 件</div>
        <div class="delta" id="figDefectDelta"></div>
      </div>
    </div>

    <div class="panels">
      <div class="card">
        <h2 class="panel-title">良品率趋势<span class="sub" id="trendSub">按日</span></h2>
        <div class="plot"><svg id="trend" role="img" aria-label="良品率按日趋势折线图"></svg></div>
      </div>
      <div class="card">
        <h2 class="panel-title">不良品数<span class="sub">件 / 日 · 纵轴自 0 起</span></h2>
        <div class="plot"><svg id="defects" role="img" aria-label="每日不良品数柱状图"></svg></div>
      </div>
    </div>
  </div>

  <div class="card groups">
    <h2 class="panel-title"><span id="groupTitle">各生产类型合格率</span><span class="sub" id="groupSub">共用同一纵轴，形状可直接互比</span><span class="dots" id="loopDots"></span></h2>
    <div class="stage" id="stage">
      <div class="sparks" id="sparks"></div>
      <div class="focus" id="focus"></div>
    </div>
    <div class="table-view">
      <div class="tv-title"><span>表格视图（全部数值）</span><span class="tv-hint" id="tvHint"></span></div>
      <div class="tv-box" id="tvBox">
        <div class="scroller" id="tableView"></div>
      </div>
    </div>
  </div>

  <div class="ft">
    <span>数据每 60 秒自动刷新</span>
    <span id="source">—</span>
    <span id="lastUpdate">尚未获取数据</span>
    <span id="serverTag"></span>
    <!-- 这里原来有个「配置 OA 账号」的链接，去掉了。大屏是挂墙上用遥控器操作的，
         根本没法输账号密码；而且实测点进去之后按返回会退不回来。账号现在一律
         在服务端配：node server.js --set-account <账号>。 -->
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// 数据源
//
// 正常走后端 /api/quality。直接双击打开本文件（没有后端）时，
// 自动退回内置示例数据，方便离线看版面。
//
// 后端口径（由需求方指定）：
//   分子 ← 接口4 检验异常录入列表 ProductionInspectionList 的不良数
//   分母 ← 接口5 检验日报列表   InspectionDailyReportList  的检验数量
// ═══════════════════════════════════════════════════════════════
var DEMO = {
  updatedAt: new Date().toISOString(),
  range: '示例数据（未连接 OA）',
  target: 96.5,
  targetIsKpi: false,   // 全厂合计那条是推算的参考线，考核表里没有这一档
  targetYearsMissing: [],   // 非空时顶部亮告警，卡片显示「目标未设」
  minSample: 50,
  rateFloor: 90,        // 纵轴最低画到 90%；低于此值的日期标红
  // 下面这些数字是互相对得上的：series 按日合计 = 三个 types 之和，
  // summary 又是 series 算出来的。和电脑版 quality.html 是同一份
  summary: {
    rate: 97, defect: 10, output: 328, periodRate: 95.9,
    rateDelta: 5.1, defectDelta: -6, deltaBase: '前一有数据日', latestDate: '2026-08-03'
  },
  series: [
    { t: '07-22', date: '2026-07-22', output:  346, defect:  12, rate: 96.5 },
    { t: '07-23', date: '2026-07-23', output:  403, defect:  14, rate: 96.5 },
    { t: '07-24', date: '2026-07-24', output:  444, defect:  10, rate: 97.7 },
    { t: '07-25', date: '2026-07-25', output:  256, defect:   8, rate: 96.9 },
    { t: '07-26', date: '2026-07-26', output:    0, defect:   0, rate: null },  // 周末无检验
    { t: '07-27', date: '2026-07-27', output:  414, defect:  18, rate: 95.7 },
    { t: '07-28', date: '2026-07-28', output:  544, defect:  17, rate: 96.9 },
    { t: '07-29', date: '2026-07-29', output:  501, defect:  27, rate: 94.6 },
    { t: '07-30', date: '2026-07-30', output:  351, defect:  18, rate: 94.9 },
    { t: '07-31', date: '2026-07-31', output:  351, defect:  21, rate: 94   },
    { t: '08-01', date: '2026-08-01', output:  198, defect:  16, rate: 91.9 },  // 低谷
    { t: '08-02', date: '2026-08-02', output:    0, defect:   0, rate: null },
    { t: '08-03', date: '2026-08-03', output:  328, defect:  10, rate: 97   },
    { t: '08-04', date: '2026-08-04', output:    0, defect:   0, rate: null }
  ],
  // 主视觉：按检验类型。清分机日均只有个位数，是 sparse（样本撑不起趋势）
  // 那一档的样板 —— 它的 08-03 是「检 2 件坏 2 件 → 0%」
  //
  // ⚠ 四张卡不是同一个指标，metricLabel 必须跟着数一起给：
  //   流水 = 一次直通率（三环节相乘，天然低一截）、组件 = 抽检一次合格率、
  //   改型和清分机 = 一次合格率。四项在品质部考核表里全是「一次」口径。
  //   目标线是季度 KPI，这里取 Q3 那一档
  types: [
    { name: '流水生产', qty: 3516, defect: 154, rate: 82.4, yieldRate: 95.6,
      metric: 'fpy', metricLabel: '一次直通率', target: 90, mode: 'daily',
      activeDays: 12, medianQty: 274, noDenomDefect: 0, lowSample: false,
      spark:     [ 90.2, 83.6, 87.5, 85.3, null, 43.8, 73.7, 85.4, 75.4, 78.0, 91.2, null, 84.1, null],
      sparkQty:  [  216,  304,  316,  226,    0,  186,  387,  344,  186,  257,  162,    0,  274,    0],
      // 07-30 那天流水共 186 件，但电检只做了 15 件 —— 直通率被拉到 43.8%

// ═══════════════════════════════════════════════════════════════
// 服务器地址
//
// 正常情况下这里留空，全部走相对路径 —— 页面从哪台机器取来就向哪台机器
// 要数，在大屏、班组长的电脑、主任的手机上一样对。所以推荐的打开方式是
//     http://<服务器内网IP>:3200/board
// 千万别写死 localhost：那在大屏上指的是平板自己，上面根本没有服务。
//
// 只有把本文件拷出去直接双击（file://）时才需要显式指定服务器。三个办法，
// 优先级从高到低：
//   1. 网址后面加 ?server=http://192.168.30.153:3200
//      —— 会记在这台设备上，以后直接双击就行，不用再加
//   2. 改下面的 DEFAULT_SERVER，改完这份文件拷到哪台机器都能用
//   3. 都没有 → 显示示例数据，并在屏上写清楚该怎么配
//
// 跨机器取数是可行的：server.js 已经给 /api/quality 带了
// Access-Control-Allow-Origin: *
// ═══════════════════════════════════════════════════════════════
var DEFAULT_SERVER = 'http://192.168.30.153:3200';   // 本机 WLAN 地址，换网络/换机器要跟着改

function resolveServer() {
  var m = /[?&]server=([^&]*)/.exec(location.search);
  if (m) {
    var v = decodeURIComponent(m[1]).replace(/\/+$/, '');
    try { localStorage.setItem('qtc.server', v); } catch (e) {}
    return v;
  }
  // 通过 http 打开时一律用相对路径，别被上次存的地址带跑偏 ——
  // 换了台服务器却还在向旧的那台要数，是最难查的一类问题
  if (location.protocol !== 'file:') return '';
  try {
    var saved = localStorage.getItem('qtc.server');
    if (saved) return saved.replace(/\/+$/, '');
  } catch (e) {}
  return DEFAULT_SERVER.replace(/\/+$/, '');
}

var SERVER = resolveServer();
function api(p) { return SERVER + p; }

// ═══════════════════════════════════════════════════════════════
// 轮播开关
//
// 下半区默认轮播：先并排给一页（谁最低一眼看得出），再逐个类型放大。
// 上半的全厂 KPI 和趋势图**不参与轮播**，始终在屏上 —— 班组长抬头
// 三秒要拿到的第一个答案是「现在够不够」，那个答案不能等轮到某一页。
//
// 关掉轮播：网址后面加 ?loop=0，退回三张小图并排的静态版面。
// 停留时长也能改：?loop=20 就是 20 秒一页。
// ═══════════════════════════════════════════════════════════════
var LOOP_MS = 15000;
var LOOP_ON = true;
(function () {
  var m = /[?&]loop=([^&]*)/.exec(location.search);
  if (!m) return;
  var v = decodeURIComponent(m[1]).trim();
  if (v === '0' || v === 'off' || v === 'false') { LOOP_ON = false; return; }
  var n = parseFloat(v);
  // 低于 5 秒读不完一页，高于 120 秒就不像轮播了 —— 越界的值当没写
  if (isFinite(n) && n >= 5 && n <= 120) LOOP_MS = n * 1000;
})();

function loadQuality() {
  return fetch(api('/api/quality'), { cache: 'no-store' }).then(function (res) {
    if (res.ok) return res.json();
    return res.json().catch(function () { return {}; }).then(function (body) {
      var err = new Error(body.error || ('HTTP ' + res.status));
      err.needSetup = Boolean(body.needSetup);   // 「没配账号」和「连不上」是两回事
      throw err;
    });
  });
}

// 浅拷贝换掉 range，用于示例数据的两种场景。
// 不用对象展开语法：那是 Chromium 60，Android 8 的内核正好卡在 58
function withRange(obj, range) {
  var out = {}, k;
  for (k in obj) if (obj.hasOwnProperty(k)) out[k] = obj[k];
  out.range = range;
  return out;
}

// ═══════════════════════════════════════════════════════════════
// 良品率状态判定
// 三档，每档配「不同形状」的图标 + 文字 —— 红绿色盲看不出红绿差别，
// 形状和文字才是可靠通道，颜色只是辅助
// ═══════════════════════════════════════════════════════════════
var GRADE = {
  good:     { icon: '●', text: '达标', color: 'var(--good)'     },
  warning:  { icon: '◆', text: '预警', color: 'var(--warning)'  },
  critical: { icon: '■', text: '超标', color: 'var(--critical)' }
};
function gradeOf(rate, target) {
  return rate >= target ? 'good' : rate >= target - 1.5 ? 'warning' : 'critical';
}

// 纵轴范围：良品率挤在 96–99 之间，从 0 起画会是一条直线。
// 折线图允许截断纵轴（柱状图不允许 —— 柱长就是数值）
//
// floor：纵轴最低必须画到这个刻度（默认 90%），这样「离 90 还有多远」
// 在图上是同一把尺子。数据真跌破 floor 时继续往下让 —— 否则点会画到
// 坐标区外面，标红的日期反而指向一个看不见的点
function rateScale(values, target, floor) {
  var nums = [], i;
  for (i = 0; i < values.length; i++) if (typeof values[i] === 'number') nums.push(values[i]);
  if (!nums.length) nums.push(target);
  nums.push(target);
  var lo = Math.floor(Math.min.apply(null, nums) - 0.5);
  if (typeof floor === 'number') lo = Math.min(lo, floor);
  return { lo: Math.max(0, lo), hi: 100 };   // 良品率没有负数，留一手防出现 0% 的日子把轴拉到 -1
}

// 时间和千分位一律手写。toLocaleTimeString('zh-CN') 依赖设备 ICU，
// 同样的代码在不同 MAXHUB 上可能给 14:23:07，也可能给 下午2:23:07
function p2(n) { return (n < 10 ? '0' : '') + n; }
function hms(d) { return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
function group(n) {
  var s = String(n), out = '', c = 0, i;
  for (i = s.length - 1; i >= 0; i--) {
    out = s.charAt(i) + out;
    if (++c % 3 === 0 && i > 0) out = ',' + out;
  }
  return out;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) {
  var n = document.createElementNS(SVGNS, tag), k;
  for (k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

// 老 WebView 上 svg{height:auto} 会算出 0 或 150px。
// 量出父容器宽度，把 width/height 显式写死，任何内核都不会猜错
function sizeSvg(svg, vbW, vbH) {
  var w = svg.parentNode.clientWidth || 1;
  svg.setAttribute('viewBox', '0 0 ' + vbW + ' ' + vbH);
  svg.setAttribute('width', w);
  svg.setAttribute('height', Math.round(w * vbH / vbW));
}

// ═══════════════════════════════════════════════════════════════
// 主图：良品率按日折线
// ═══════════════════════════════════════════════════════════════
function renderTrend(data) {
  var svg = document.getElementById('trend');
  svg.textContent = '';

  var W = 1200, H = 250, padL = 78, padR = 104, padT = 28, padB = 44;
  sizeSvg(svg, W, H);

  var plotW = W - padL - padR, plotH = H - padT - padB;
  var pts = data.series, i;
  if (!pts.length) return;

  var rates = [];
  for (i = 0; i < pts.length; i++) rates.push(pts[i].rate);
  var floor = typeof data.rateFloor === 'number' ? data.rateFloor : 90;
  var sc = rateScale(rates, data.target, floor), lo = sc.lo, hi = sc.hi;

  var x = function (i) { return padL + (pts.length === 1 ? plotW / 2 : i * plotW / (pts.length - 1)); };
  var y = function (v) { return padT + plotH - (v - lo) / (hi - lo) * plotH; };
  var hasVal = function (i) { return typeof pts[i].rate === 'number'; };
  var weakAt = function (i) { return pts[i].output > 0 && pts[i].output < data.minSample; };
  var belowFloor = function (i) { return hasVal(i) && pts[i].rate < floor; };

  // 网格：发丝实线，比数据弱一档（虚线会被读成「阈值」）
  var gridStep = (hi - lo) > 8 ? 2 : 1;
  for (var v = lo; v <= hi; v += gridStep) {
    svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(v), y2: y(v),
      stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.appendChild(el('text', { x: padL - 14, y: y(v) + 7, 'text-anchor': 'end',
      fill: 'var(--ink-muted)', 'font-size': 20 }, v + '%'));
  }

  // 这条线是全厂合计的**参考线**，不是 KPI —— 考核表的质量类只有四项，
  // 没有「全厂合计」这一档，96.5 是推算出来的。五米外看，「目标」两个字
  // 会让人以为全厂有考核线。真正的目标线在下面四张卡上。
  svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(data.target), y2: y(data.target),
    stroke: 'var(--warning)', 'stroke-width': 2, 'stroke-dasharray': '8 6', 'stroke-linecap': 'round' }));
  svg.appendChild(el('text', { x: padL + 6, y: y(data.target) - 11,
    fill: 'var(--ink-2)', 'font-size': 19 },
    (data.targetIsKpi === false ? '参考 ' : '目标 ') + data.target + '%'));

  // 不画面积填充：纵轴是截断的，面积会把「离基线多远」说成「有多少」

  // 没有检验记录的日子（周末、停产）直接断开 —— 补 0 会画出一条
  // 冲到底的假曲线，那是数据里没有的事
  for (i = 1; i < pts.length; i++) {
    if (!hasVal(i) || !hasVal(i - 1)) continue;
    var weak = weakAt(i) || weakAt(i - 1);
    svg.appendChild(el('path', {
      d: 'M' + x(i - 1) + ',' + y(pts[i - 1].rate) + ' L' + x(i) + ',' + y(pts[i].rate),
      fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2.5,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: weak ? 0.35 : 1
    }));
  }

  // 数据点带 2px 表面色环，压线时也看得清
  for (i = 0; i < pts.length; i++) {
    if (!hasVal(i)) continue;
    var wk = weakAt(i);
    svg.appendChild(el('circle', { cx: x(i), cy: y(pts[i].rate), r: 5,
      fill: wk ? 'var(--surface)' : 'var(--series-1)',
      stroke: wk ? 'var(--series-1)' : 'var(--surface)',
      'stroke-width': 2, opacity: wk ? 0.6 : 1 }));
  }

  // 直接标注只标两个：末点和最低点。每点都标等于没标
  var idx = [];
  for (i = 0; i < pts.length; i++) if (hasVal(i)) idx.push(i);
  if (idx.length) {
    var last = idx[idx.length - 1], low = idx[0];
    for (i = 0; i < idx.length; i++) if (pts[idx[i]].rate < pts[low].rate) low = idx[i];
    var tag = function (i, anchor, dy) {
      svg.appendChild(el('text', {
        x: x(i) + (anchor === 'start' ? 12 : 0), y: y(pts[i].rate) + dy,
        'text-anchor': anchor, fill: 'var(--ink)', 'font-size': 26, 'font-weight': 600
      }, pts[i].rate.toFixed(1) + '%'));
    };
    if (low !== last) tag(low, 'middle', 34);
    tag(last, 'start', 8);
  }

  svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: padT + plotH, y2: padT + plotH,
    stroke: 'var(--axis)', 'stroke-width': 1 }));

  // 日期多的时候隔一个标一个，免得挤成一坨。
  // 未达 floor 的日子是例外，一定要标出来 —— 被隔一个跳掉就等于没有提示
  var every = pts.length > 16 ? 2 : 1;
  for (i = 0; i < pts.length; i++) {
    if (i % every !== 0 && i !== pts.length - 1 && !belowFloor(i)) continue;
    var bad = belowFloor(i);
    svg.appendChild(el('text', { x: x(i), y: padT + plotH + 31, 'text-anchor': 'middle',
      fill: bad ? 'var(--critical)' : 'var(--ink-muted)',
      'font-size': 20, 'font-weight': bad ? 700 : 400,
      // 样本不足仍旧压暗，但压得比常规轻：这天既「不达标」又「不可靠」，
      // 两个信息都要留住，不能让 0.55 把红色弱化到看不出来
      opacity: bad ? (weakAt(i) ? 0.7 : 1) : (hasVal(i) ? (weakAt(i) ? 0.55 : 1) : 0.4)
    }, pts[i].t));
  }

  // 纵轴不从 0 起必须说明，否则会被读成「良品率快掉到底了」。
  // 标红是新增的约定，同样得在图上讲清楚，不能让人猜
  svg.appendChild(el('text', { x: padL, y: 17, fill: 'var(--ink-muted)', 'font-size': 17 },
    '纵轴 ' + lo + '–' + hi + '%（非零起点）· 空心点＝当日检验数不足 ' +
    data.minSample + ' 件，比率仅供参考 · 断开＝当日无检验记录 · 日期标红＝当日良品率低于 ' +
    floor + '%'));
}

// ═══════════════════════════════════════════════════════════════
// 副图：每日不良品数
//
// 不和良品率画在一张图上（双纵轴）：两轴怎么对齐全凭主观，
// 图会「造」出数据里根本没有的相关性。拆成上下两张，共用时间轴
// ═══════════════════════════════════════════════════════════════
function renderDefects(data) {
  var svg = document.getElementById('defects');
  svg.textContent = '';

  // 左右内边距与主图完全一致，两张图的时间轴天然对齐
  var W = 1200, H = 170, padL = 78, padR = 104, padT = 16, padB = 44;
  sizeSvg(svg, W, H);

  var plotW = W - padL - padR, plotH = H - padT - padB;
  var pts = data.series, i;
  if (!pts.length) return;

  var raw = 1;
  for (i = 0; i < pts.length; i++) if (pts[i].defect > raw) raw = pts[i].defect;
  var step = raw <= 10 ? 2 : raw <= 30 ? 10 : raw <= 100 ? 25 : 50;
  var hi = Math.ceil(raw / step) * step;             // 柱状图纵轴必须从 0 起
  var slot = plotW / pts.length;
  var bw = Math.max(4, Math.min(26, slot - 12));     // 柱不占满槽位，留空气
  var x = function (i) { return padL + slot * (i + 0.5); };
  var y = function (v) { return padT + plotH - v / hi * plotH; };

  for (var v = 0; v <= hi; v += step) {
    svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(v), y2: y(v),
      stroke: v === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
    svg.appendChild(el('text', { x: padL - 14, y: y(v) + 7, 'text-anchor': 'end',
      fill: 'var(--ink-muted)', 'font-size': 20 }, v));
  }

  var every = pts.length > 16 ? 2 : 1;
  for (i = 0; i < pts.length; i++) {
    var p = pts[i];
    if (p.output > 0 && p.defect > 0) {
      var r = Math.min(4, bw / 2);
      var l = x(i) - bw / 2, rr = x(i) + bw / 2, t = y(p.defect), b = padT + plotH;
      // 数据端 4px 圆角、基线端方角，从同一条基线长出来
      svg.appendChild(el('path', {
        d: 'M' + l + ',' + b + ' L' + l + ',' + (t + r) +
           ' Q' + l + ',' + t + ' ' + (l + r) + ',' + t +
           ' L' + (rr - r) + ',' + t +
           ' Q' + rr + ',' + t + ' ' + rr + ',' + (t + r) +
           ' L' + rr + ',' + b + ' Z',
        fill: 'var(--series-1)',
        opacity: p.output < data.minSample ? 0.45 : 1
      }));
    }
    if (i % every !== 0 && i !== pts.length - 1) continue;
    svg.appendChild(el('text', { x: x(i), y: padT + plotH + 31, 'text-anchor': 'middle',
      fill: 'var(--ink-muted)', 'font-size': 20,
      opacity: p.output > 0 ? (p.output < data.minSample ? 0.55 : 1) : 0.4 }, p.t));
  }

  var peak = 0;
  for (i = 0; i < pts.length; i++) if (pts[i].defect > pts[peak].defect) peak = i;
  if (pts[peak].defect > 0) {
    svg.appendChild(el('text', { x: x(peak), y: y(pts[peak].defect) - 13, 'text-anchor': 'middle',
      fill: 'var(--ink)', 'font-size': 26, 'font-weight': 600 }, pts[peak].defect));
  }
}

// ═══════════════════════════════════════════════════════════════
// 小倍数：每个生产类型一张迷你折线
//
// 分组维度是「检验类型」（流水生产 / 成品改型 / 清分机），不是产品代码。
// 理由：两个接口都有这个字段，分子分母能对齐；而且它回答的正是班组长
// 站在屏幕前真正要问的那句「哪条线拖的后腿」。产品维度退到表格视图。
//
// 所有小图共用同一个纵轴范围 —— 各画各的范围会让所有线看起来一样陡，
// 那是在骗人。但共用纵轴有个前提：参与定标的点得可信。实测清分机有过
// 「当天检 2 件、坏 2 件 → 0%」的点，让它定标会把另两条线压成平线。所以：
//   · 定标只用样本量达标的点
//   · 整个类型都撑不起趋势的（mode 为 sparse），干脆不画图
// ═══════════════════════════════════════════════════════════════
var SPARK_SLOTS = [];

function buildSparks(data) {
  var box = document.getElementById('sparks');
  box.textContent = '';
  SPARK_SLOTS = [];

  var types = data.types || [], i;
  if (!types.length) {
    box.innerHTML = '<div class="spark-status">区间内没有可分组的检验数据</div>';
    return;
  }

  // 一行放下全部类型。类型是有限的几个，不像产品代码会长出十几个。
  // 靠 calc 分宽度，不能用 flex gap —— 那是 Chromium 84
  var perRow = Math.min(types.length, 4);
  var wCalc = 'calc((100% - ' + (perRow - 1) * 0.9 + 'rem) / ' + perRow + ')';

  for (i = 0; i < types.length; i++) {
    var t = types[i];
    // 目标线可能没有（该年的 KPI 还没配）。**不能退回 data.target** ——
    // 那是全厂的推算参考线，拿它当某条产线的 KPI 就是编一个数出来
    var target = typeof t.target === 'number' ? t.target : null;
    // 大数字用整个区间的率 —— 面板标题写的是多少天，数字就得是多少天的
    var cur = typeof t.rate === 'number' ? t.rate : null;
    var grade = (cur === null || target === null) ? null : GRADE[gradeOf(cur, target)];

    var card = document.createElement('div');
    card.className = 'spark-card';
    card.style.width = wCalc;
    if ((i + 1) % perRow === 0) card.style.marginRight = '0';

    var head = document.createElement('div');
    head.className = 'spark-head';
    var nm = document.createElement('span');
    nm.className = 'spark-name';
    // 指标名必须上卡。四张卡不是同一个指标 —— 流水是一次直通率、组件是抽检
    // 一次合格率、改型和清分机是一次合格率。不标出来，五米外的读者会拿四把
    // 不同的尺子横向比较，「82% 的流水」看着比「98% 的改型」差得多，其实不可比。
    // 「一次」两个字是考核表的原话（first-pass），少了会被读成最终合格率
    nm.textContent = t.metricLabel ? (t.name + ' · ' + t.metricLabel) : t.name;
    var rt = document.createElement('span');
    rt.className = 'spark-rate';
    rt.textContent = cur === null ? '—' : cur.toFixed(t.decimals || 1) + '%';
    head.appendChild(nm); head.appendChild(rt);
    card.appendChild(head);

    var plot = null;
    if (t.mode === 'sparse') {
      // 样本撑不起趋势：写清楚为什么，不画任何几何图形。
      // 几个点连成的线，五米外会被当成趋势读，那是无中生有
      var none = document.createElement('div');
      none.className = 'spark-none';
      none.textContent = '近 ' + data.series.length + ' 天仅 ' + group(t.qty) + ' 件、'
        + t.activeDays + ' 天有检验，日均不足 ' + data.minSample + ' 件，'
        + '画趋势线是在把噪声当信号。逐日值见表格视图。';
      card.appendChild(none);
      plot = none;                       // 高度在 drawSparks 里和迷你图对齐
    } else {
      plot = document.createElement('div');
      plot.className = 'plot';
      card.appendChild(plot);
    }

    var st = document.createElement('div');
    st.className = 'spark-status';
    if (!grade && target === null && cur !== null) {
      // 有数、但没有 KPI 可比。写清楚原因，否则「无数据」会被理解成
      // 「这条线今天没生产」，那是完全不同的一件事
      st.textContent = (typeof t.qty === 'number' ? group(t.qty) + ' 件 · ' : '')
        + '本年目标未设，不判达标';
    } else if (grade) {
      var dot = document.createElement('span');
      dot.className = 'ic';
      dot.style.color = grade.color;
      dot.textContent = grade.icon;
      var tx = document.createElement('span');
      // 检验量也写出来：光看比率不知道它建立在多少件上
      tx.textContent = t.lowSample
        ? grade.text + '（仅 ' + t.qty + ' 件，样本不足）'
        : grade.text + (typeof t.qty === 'number' ? ' · ' + group(t.qty) + ' 件' : '');
      st.appendChild(dot); st.appendChild(tx);
    } else {
      st.textContent = '无数据';
    }
    card.appendChild(st);

    // 各卡目标线不同，逐卡写出来 —— 否则三条虚线高度不一，会被当成数据在动
    var tg = document.createElement('div');
    tg.className = 'spark-target';
    tg.textContent = (target === null ? '目标未设' : '目标 ' + target + '%')
      + (t.noDenomDefect ? ' · ' + t.noDenomDefect + ' 件不良当天无日报，未计入' : '');
    card.appendChild(tg);

    box.appendChild(card);
    SPARK_SLOTS.push({ plot: plot, t: t, target: target, cur: cur, grade: grade,
                       sparse: t.mode === 'sparse' });
  }
}

// 定标：只取画得出趋势的类型里样本量达标的点，外加每个类型自己的目标线。
// 抽出来单独一个函数，是因为并排页和轮播放大页**必须共用同一个纵轴** ——
// 轮播时读者是靠记忆跨页比较的，纵轴一页一变，比较就完全失效了
// 某一天的点可不可信。服务端算好了放在 sparkThin 里 —— 流水按**环节**判：
// 实测有「当天流水共 186 件、但电检只做了 15 件」把直通率拉到 43.8% 的日子，
// 按当日总量判它是达标样本，那个点会被实心画出来，五米外就是一个真实的暴跌。
// 没有 sparkThin 时退回老规则（按当日总量），离线快照和旧后端都还能用。
function thinAt(t, k, data) {
  if (t.sparkThin) return !!t.sparkThin[k];
  var n = t.sparkQty ? t.sparkQty[k] : undefined;
  return n !== undefined && n > 0 && n < data.minSample;
}

function typeScale(data) {
  var types = data.types || [], all = [], i, j;
  for (i = 0; i < types.length; i++) {
    if (typeof types[i].target === 'number') all.push(types[i].target);
    if (types[i].mode === 'sparse') continue;
    for (j = 0; j < types[i].spark.length; j++) {
      if (typeof types[i].spark[j] === 'number' && !thinAt(types[i], j, data)) {
        all.push(types[i].spark[j]);
      }
    }
  }
  return rateScale(all, data.target);
}

function drawSparks(data) {
  if (!SPARK_SLOTS.length) return;
  var i, j;
  var sc = typeScale(data), lo = sc.lo, hi = sc.hi;

  var W = 240, padT = 6, padB = 6;

  for (i = 0; i < SPARK_SLOTS.length; i++) {
    var s = SPARK_SLOTS[i];

    // 不画图的卡由 flex 自己撑满，不用再算高度
    if (s.sparse) continue;

    var t = s.t, sp = t.spark;
    // 和放大页同一套：量出 flex 分给这块的像素，反解出 viewBox 高度，
    // 图正好填满，永远不会溢出到状态行上
    var H = s.plot.clientHeight > 0
      ? Math.round(s.plot.clientHeight * W / (s.plot.clientWidth || 1))
      : 56;
    if (H < padT + padB + 10) H = padT + padB + 10;
    s.plot.textContent = '';
    var svg = el('svg', { role: 'img', 'aria-label':
      t.name + (t.metricLabel || '一次合格率') + '趋势，区间 ' +
      (s.cur === null ? '无数据' : s.cur.toFixed(t.decimals || 1) + '%') +
      (s.grade ? '，' + s.grade.text : '') +
      '，' + (s.target === null ? '本年目标未设' : '目标 ' + s.target + '%') });
    s.plot.appendChild(svg);
    sizeSvg(svg, W, H);

    var x = function (k) { return sp.length === 1 ? W / 2 : k * W / (sp.length - 1); };
    // 定标排除了小样本点，个别点会落到轴外 —— 夹回画布内，否则画到卡片外面去
    var y = function (v) {
      var raw = padT + (H - padT - padB) - (v - lo) / (hi - lo) * (H - padT - padB);
      return Math.max(padT, Math.min(H - padB, raw));
    };
    var weakAt = function (k) { return thinAt(t, k, data); };

    // 小图里也保留目标线，否则读者没有判断高低的锚点。
    // 本年 KPI 没配就不画，理由同放大页
    if (s.target !== null) {
      svg.appendChild(el('line', { x1: 0, x2: W, y1: y(s.target), y2: y(s.target),
        stroke: 'var(--warning)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4', opacity: 0.75 }));
    }

    for (j = 1; j < sp.length; j++) {
      if (typeof sp[j] !== 'number' || typeof sp[j - 1] !== 'number') continue;
      svg.appendChild(el('path', {
        d: 'M' + x(j - 1) + ',' + y(sp[j - 1]) + ' L' + x(j) + ',' + y(sp[j]),
        fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2.5,
        'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        opacity: (weakAt(j) || weakAt(j - 1)) ? 0.35 : 1 }));
    }

    // 小样本点画空心，和主图一个规矩
    for (j = 0; j < sp.length; j++) {
      if (typeof sp[j] !== 'number' || !weakAt(j)) continue;
      svg.appendChild(el('circle', { cx: x(j), cy: y(sp[j]), r: 3.5,
        fill: 'var(--surface)', stroke: 'var(--series-1)', 'stroke-width': 1.5, opacity: 0.6 }));
    }

    var lastIdx = -1;
    for (j = 0; j < sp.length; j++) if (typeof sp[j] === 'number') lastIdx = j;
    if (lastIdx >= 0) {
      svg.appendChild(el('circle', { cx: x(lastIdx), cy: y(sp[lastIdx]), r: 4.5,
        fill: weakAt(lastIdx) ? 'var(--surface)' : 'var(--series-1)',
        stroke: weakAt(lastIdx) ? 'var(--series-1)' : 'var(--surface)', 'stroke-width': 2 }));
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// 轮播：下半区逐页放大单个生产类型
//
// 页序：第 0 页是三张小图并排，之后每个类型各一页。
//
// 为什么保留第 0 页那张并排页：看板的头号任务是「哪条线拖的后腿」，
// 而这个问题只有把几条线摆在一起才答得出。逐页放大能看清每条线自己的
// 形状，却看不出谁最低 —— 两者都要，所以并排页留着当第一页。
//
// 上半区（全厂 KPI + 两张主图）不参与轮播：抬头三秒要拿到的第一个答案
// 是「现在够不够」，那个不能等轮到某一页才出现。
// ═══════════════════════════════════════════════════════════════
var LOOP_PAGES = [];        // [{kind:'all'}, {kind:'type', i:n}, …]
var loopIdx = 0;
var GROUP_SUB_ALL = '';     // 并排页的副标题，切回来时要还原

function buildLoopPages(data) {
  var types = data.types || [], i;
  LOOP_PAGES = [{ kind: 'all' }];
  for (i = 0; i < types.length; i++) LOOP_PAGES.push({ kind: 'type', i: i });
  // 数据刷新后类型可能增减，越界就回到第一页；否则保持在原页，
  // 不能因为后台每 60 秒刷一次数就把轮播打回开头
  if (loopIdx >= LOOP_PAGES.length) loopIdx = 0;
}

function renderDots() {
  var box = document.getElementById('loopDots');
  if (!LOOP_ON || LOOP_PAGES.length < 2) { box.textContent = ''; return; }
  var html = '', i;
  for (i = 0; i < LOOP_PAGES.length; i++) {
    html += i === loopIdx ? '<span class="on">●</span>' : '<span>○</span>';
  }
  box.innerHTML = html;
}

// 放大页的 DOM。每翻一页重建 —— 类型不同，内容全不一样，
// 复用节点省不下什么，反而容易漏掉上一页残留的状态
function buildFocus(data, t) {
  var box = document.getElementById('focus');
  box.textContent = '';
  var target = typeof t.target === 'number' ? t.target : null;
  var grade = (typeof t.rate === 'number' && target !== null) ? GRADE[gradeOf(t.rate, target)] : null;

  var head = document.createElement('div');
  head.className = 'focus-head';
  var nm = document.createElement('span');
  nm.className = 'focus-name';
  // 放大页更要写清指标：这一页只剩一条线，没有旁边几张卡当参照，
  // 「82.4%」单独摆在 4K 屏上，不写「直通率」会被当成良品率读
  nm.textContent = t.metricLabel ? (t.name + ' · ' + t.metricLabel) : t.name;
  var rt = document.createElement('span');
  rt.className = 'focus-rate';
  rt.textContent = typeof t.rate === 'number' ? t.rate.toFixed(t.decimals || 1) + '%' : '—';
  head.appendChild(nm); head.appendChild(rt);
  box.appendChild(head);

  if (t.mode === 'sparse') {
    var none = document.createElement('div');
    none.className = 'focus-none';
    none.textContent = '近 ' + data.series.length + ' 天仅 ' + group(t.qty) + ' 件、'
      + t.activeDays + ' 天有检验，日均不足 ' + data.minSample + ' 件。'
      + '这个量画不出可信的趋势，逐日值见表格视图。';
    box.appendChild(none);
  } else {
    var plot = document.createElement('div');
    plot.className = 'plot';
    plot.id = 'focusPlot';
    box.appendChild(plot);
  }

  var meta = document.createElement('div');
  meta.className = 'focus-meta';
  // 有数但本年没配 KPI：照常把量报出来，只是不判达标。
  // 走 else 分支显示「无数据」会把「没目标」说成「没生产」
  if (!grade && target === null && typeof t.rate === 'number') {
    meta.textContent = group(t.qty) + ' 件检验 / ' + group(t.defect) + ' 件不良'
      + ' · 本年目标未设，不判达标'
      + (t.source ? ' · 来源 ' + t.source : '');
  } else if (grade) {
    // 流水放大页把三个环节的合格率摊出来。看板的头号任务是「哪条线拖后腿」，
    // 翻到流水这一页，下一个问题立刻就是「哪个环节拖后腿」—— 实测电检最低，
    // 而且检验量不到另两个环节的一半。不写出来，读者只能看到一个 82.4%
    // fmt() 是表格视图那个函数里的局部变量，这里够不着 —— 就地写一遍。
    // 直接调会抛 ReferenceError，而这一页只在轮播翻到流水时才渲染，
    // 报错要过好几分钟才看得见
    var stageTxt = '';
    if (t.stages && t.stages.length) {
      var st = [], si, sr;
      for (si = 0; si < t.stages.length; si++) {
        sr = t.stages[si].rate;
        st.push(t.stages[si].label + ' ' + (typeof sr === 'number' ? sr.toFixed(1) : '—') + '%');
      }
      stageTxt = ' · ' + st.join(' × ');
    }
    meta.innerHTML = '<span class="ic" style="color:' + grade.color + '">' + grade.icon + '</span>'
      + grade.text + ' · ' + group(t.qty) + ' 件检验 / ' + group(t.defect) + ' 件不良'
      + ' · 目标 ' + target + '%' + stageTxt
      + (t.source ? ' · 来源 ' + esc(t.source) : '')
      + (t.noDenomDefect ? ' · ' + t.noDenomDefect + ' 件不良当天无日报，未计入' : '');
  } else {
    meta.textContent = '无数据';
  }
  box.appendChild(meta);
}

// 放大页的折线。纵轴和并排页完全一致（typeScale），换页时线的高低可直接比
function drawFocus(data, t) {
  if (t.mode === 'sparse') return;
  var plot = document.getElementById('focusPlot');
  if (!plot) return;
  plot.textContent = '';

  var target = typeof t.target === 'number' ? t.target : null;
  var sc = typeScale(data), lo = sc.lo, hi = sc.hi;
  var sp = t.spark, j;

  // 高度不写死：量出 flex 分给这块的实际像素，再折算成 viewBox 高度。
  // sizeSvg 是按 宽度×(vbH/vbW) 定高的，所以反过来解出 vbH，
  // 画出来的图就正好填满可用空间，一个像素都不会溢出到状态行上
  var W = 1200, padL = 78, padR = 104;
  var availPx = plot.clientHeight || 0;
  var wPx = plot.clientWidth || 1;
  var H = availPx > 0 ? Math.round(availPx * W / wPx) : 110;
  // 太扁就放不下日期轴了，那时候宁可不标日期 —— 上面那张主图已经有完整日期轴
  var showDays = H >= 78;
  var padT = 12, padB = showDays ? 30 : 10;
  if (H < padT + padB + 20) H = padT + padB + 20;   // 兜底，别算出负高度

  var svg = el('svg', { role: 'img', 'aria-label':
    t.name + (t.metricLabel || '一次合格率') + '按日趋势，区间 ' +
    (typeof t.rate === 'number' ? t.rate.toFixed(1) + '%' : '无数据') +
    '，目标 ' + target + '%' });
  plot.appendChild(svg);
  sizeSvg(svg, W, H);

  var plotW = W - padL - padR, plotH = H - padT - padB;
  var x = function (k) { return padL + (sp.length === 1 ? plotW / 2 : k * plotW / (sp.length - 1)); };
  // 定标排除了小样本点，个别点会落到轴外 —— 夹回画布内
  var y = function (v) {
    var raw = padT + plotH - (v - lo) / (hi - lo) * plotH;
    return Math.max(padT, Math.min(padT + plotH, raw));
  };
  var weakAt = function (k) { return thinAt(t, k, data); };

  // 纵轴只标首末两档。这条带子很扁，标满刻度会糊成一片
  var vs = [lo, hi], vi;
  for (vi = 0; vi < vs.length; vi++) {
    svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(vs[vi]), y2: y(vs[vi]),
      stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.appendChild(el('text', { x: padL - 12, y: y(vs[vi]) + 6, 'text-anchor': 'end',
      fill: 'var(--ink-muted)', 'font-size': 17,
      'font-variant-numeric': 'tabular-nums' }, vs[vi] + '%'));
  }

  // 目标线是真正的阈值，虚线在这里是正当用法。
  // 本年 KPI 没配就不画 —— 一条位置全凭兜底值决定的虚线比不画更误导
  if (target !== null) {
    svg.appendChild(el('line', { x1: padL, x2: padL + plotW, y1: y(target), y2: y(target),
      stroke: 'var(--warning)', 'stroke-width': 2, 'stroke-dasharray': '8 6', 'stroke-linecap': 'round' }));
    svg.appendChild(el('text', { x: padL + plotW + 10, y: y(target) + 6,
      fill: 'var(--ink-2)', 'font-size': 17 }, '目标 ' + target + '%'));
  }

  for (j = 1; j < sp.length; j++) {
    if (typeof sp[j] !== 'number' || typeof sp[j - 1] !== 'number') continue;
    svg.appendChild(el('path', {
      d: 'M' + x(j - 1) + ',' + y(sp[j - 1]) + ' L' + x(j) + ',' + y(sp[j]),
      fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 3,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      opacity: (weakAt(j) || weakAt(j - 1)) ? 0.35 : 1 }));
  }
  for (j = 0; j < sp.length; j++) {
    if (typeof sp[j] !== 'number') continue;
    svg.appendChild(el('circle', { cx: x(j), cy: y(sp[j]), r: weakAt(j) ? 4 : 5,
      fill: weakAt(j) ? 'var(--surface)' : 'var(--series-1)',
      stroke: weakAt(j) ? 'var(--series-1)' : 'var(--surface)',
      'stroke-width': 2, opacity: weakAt(j) ? 0.6 : 1 }));
  }

  // 日期轴。点多的时候隔一个标一个，免得挤成一坨
  var every = sp.length > 16 ? 2 : 1;
  for (j = 0; showDays && j < sp.length; j++) {
    if (j % every !== 0 && j !== sp.length - 1) continue;
    var q = t.sparkQty ? t.sparkQty[j] : 1;
    svg.appendChild(el('text', { x: x(j), y: padT + plotH + 24, 'text-anchor': 'middle',
      fill: 'var(--ink-muted)', 'font-size': 17, 'font-variant-numeric': 'tabular-nums',
      opacity: q > 0 ? (weakAt(j) ? 0.55 : 1) : 0.4 }, data.series[j] ? data.series[j].t : ''));
  }
}

// 切到当前页：并排页显示 #sparks，类型页显示 #focus。
// 两者不能同时可见 —— 隐藏的那个 clientWidth 是 0，SVG 会被量成 0 宽
function showLoopPage() {
  if (!CURRENT) return;
  var sparks = document.getElementById('sparks');
  var focus = document.getElementById('focus');
  var title = document.getElementById('groupTitle');
  var sub = document.getElementById('groupSub');
  var page = LOOP_PAGES.length ? LOOP_PAGES[loopIdx] : null;

  if (!LOOP_ON || !page || page.kind === 'all') {
    sparks.style.display = '';
    focus.className = 'focus';
    title.textContent = '各生产类型合格率';
    sub.textContent = GROUP_SUB_ALL;
  } else {
    var t = CURRENT.types[page.i];
    sparks.style.display = 'none';
    focus.className = 'focus on';
    // 标题保持不变 —— 类型名由页内那个大号标题承担，两处都写就是重复，
    // 而且标题一页一变会让人以为整块看板换了内容
    title.textContent = '各生产类型合格率';
    sub.textContent = t.mode === 'sparse'
      ? '样本不足，只给区间累计值'
      : CURRENT.series.length + ' 天 · 纵轴与其它类型一致，可直接比高低';
    buildFocus(CURRENT, t);
  }
  renderDots();
  drawStage();
}

function drawStage() {
  if (!CURRENT) return;
  var page = LOOP_PAGES.length ? LOOP_PAGES[loopIdx] : null;
  if (!LOOP_ON || !page || page.kind === 'all') drawSparks(CURRENT);
  else drawFocus(CURRENT, CURRENT.types[page.i]);
}

// 翻页**不用 setInterval 计时**，改成记一个「上次翻页的时刻」，由每秒的
// 时钟心跳去比对。原因是踩过的一个真 bug：
//
//   原来是 startLoop() → stopLoop() + setInterval(15秒)。而 startLoop() 在
//   render()（每 60 秒随数据刷新）和 visibilitychange 里都会被调到，每调一次
//   就把 15 秒倒计时清零重数。进全屏时 MAXHUB 会连着抛 resize /
//   fullscreenchange / visibilitychange，这些事件只要来得比 15 秒密，
//   倒计时就永远数不完 —— 表现就是「全屏之后只转一次就不动了」。
//
// 记时刻不记倒计时，就没有「被清零」这回事：
//   · 谁调多少次都不影响进度
//   · 定时器被安卓挂起后醒来，一比对发现早该翻了，立刻补上
//   · 心跳被节流成几秒一次也只是稍微晚一点，不会卡死
var loopLastFlip = 0;

// 由 tickClock 每秒调一次
function loopTick() {
  if (!LOOP_ON || LOOP_PAGES.length < 2) return;
  var now = Date.now();
  if (!loopLastFlip) { loopLastFlip = now; return; }   // 第一页也要完整停够一轮
  if (now - loopLastFlip < LOOP_MS) return;
  loopLastFlip = now;
  loopIdx = (loopIdx + 1) % LOOP_PAGES.length;
  showLoopPage();
}

// 上电/换数据时只「起表」，不重置进度 —— 已经在计的那一页该翻还是要翻
function loopArm() {
  if (!loopLastFlip) loopLastFlip = Date.now();
}

// ═══════════════════════════════════════════════════════════════
// 表格视图 —— 每张图的等价物。大屏上折叠着，但值永远拿得到，
// 不会出现「只有把鼠标悬上去才能读到数」的情况（大屏根本没鼠标）
// ═══════════════════════════════════════════════════════════════
var LAST_TABLE_HTML = null;

function renderTable(data) {
  var fmt = function (v) { return typeof v === 'number' ? v.toFixed(1) : '—'; };
  var dim = function (p) { return p.output > 0 && p.output < data.minSample ? ' style="color:var(--ink-muted)"' : ''; };

  var days = '', rowQty = '', rowDef = '', rowRate = '', i, j;
  for (i = 0; i < data.series.length; i++) {
    var p = data.series[i];
    days    += '<th>' + esc(p.t) + '</th>';
    rowQty  += '<td>' + group(p.output) + '</td>';
    rowDef  += '<td>' + group(p.defect) + '</td>';
    rowRate += '<td' + dim(p) + '>' + fmt(p.rate) + '</td>';
  }

  var html =
    '<table><thead><tr><th>日期</th>' + days + '</tr></thead><tbody>' +
      '<tr><td>检验数（件）</td>' + rowQty + '</tr>' +
      '<tr><td>不良数（件）</td>' + rowDef + '</tr>' +
      '<tr><td>良品率（%）</td>' + rowRate + '</tr>' +
    '</tbody></table>';

  // 生产类型表。sparse 的类型（清分机）在图上没有折线，
  // 它的逐日值只能在这里读到 —— 这张表是它唯一的出口
  var types = data.types || [];
  if (types.length) {
    html += '<table><thead><tr><th>生产类型</th><th>指标</th>' + days +
            '<th>区间</th><th>目标</th><th>状态</th></tr></thead><tbody>';
    for (i = 0; i < types.length; i++) {
      var t = types[i];
      // 同卡片：没配 KPI 就不比，不拿全厂参考线顶上
      var tg = typeof t.target === 'number' ? t.target : null;
      var gr = (typeof t.rate === 'number' && tg !== null) ? GRADE[gradeOf(t.rate, tg)] : null;
      html += '<tr><td>' + esc(t.name) + '</td><td>' + esc(t.metricLabel || '一次合格率') + '</td>';
      for (j = 0; j < t.spark.length; j++) {
        html += '<td' + (thinAt(t, j, data) ? ' style="color:var(--ink-muted)"' : '') +
                '>' + fmt(t.spark[j]) + '</td>';
      }
      html += '<td>' + fmt(t.rate) + '</td><td>' + (tg === null ? '未设' : tg) + '</td>' +
              '<td>' + (gr ? gr.icon + ' ' + gr.text : '—') + '</td></tr>';
    }
    html += '</tbody></table>';
    html += '<div class="spark-target">淡色＝当日样本不足 ' + data.minSample +
            ' 件，比率仅供参考（流水按各环节分别判定）</div>';
  }

  // 流水三环节。大屏第 2 页放大流水时，「哪个环节拖后腿」只有这张表答得出
  var fs = data.flowStages || [];
  if (fs.length) {
    html += '<table><thead><tr><th>流水环节</th><th>检验数</th><th>不良数</th>' +
            '<th>合格率（%）</th></tr></thead><tbody>';
    for (i = 0; i < fs.length; i++) {
      html += '<tr><td>' + esc(fs[i].label) + '</td><td>' + group(fs[i].qty || 0) + '</td>' +
              '<td>' + group(fs[i].defect || 0) + '</td><td>' + fmt(fs[i].rate) + '</td></tr>';
    }
    html += '<tr><td><strong>直通率</strong></td><td colspan="2">三环节相乘</td>' +
            '<td><strong>' + fmt(data.flowFpy) + '</strong></td></tr>';
    html += '</tbody></table>';
    html += '<div class="spark-target">直通率 ＝ 电检合格率 × 装配检合格率 × 流水检合格率；' +
            '互检无分母，不参与计算' +
            (data.crossCheck && data.crossCheck.partialNote
              ? '<br>' + esc(data.crossCheck.partialNote) : '') + '</div>';
  }

  var groups = data.groups || [];
  if (groups.length) {
    html += '<table><thead><tr><th>产品</th>' + days + '<th>区间</th><th>件数</th></tr></thead><tbody>';
    for (i = 0; i < groups.length; i++) {
      var g = groups[i];
      html += '<tr><td>' + esc(g.name) + '</td>';
      for (j = 0; j < g.spark.length; j++) html += '<td>' + fmt(g.spark[j]) + '</td>';
      html += '<td>' + fmt(g.rate) + '</td><td>' + group(g.qty || 0) + '</td></tr>';
    }
    html += '</tbody></table>';
    html += '<div class="spark-target">「哪条线拖后腿」看上面的生产类型表，这张回答的是「哪个机型不良多」</div>';
  }

  // 服务端向 OA 取数有 5 分钟缓存，而这里 60 秒就重画一次 —— 绝大多数
  // 时候表格内容一个字都没变。内容没变就别碰 DOM：重设 innerHTML 会把
  // 滚动位置打回顶端，表格每分钟自己跳一次，看起来像在抽风
  if (html === LAST_TABLE_HTML) return;
  LAST_TABLE_HTML = html;
  document.getElementById('tableView').innerHTML = html;
  autoScrollReset();
}

// ═══════════════════════════════════════════════════════════════
// 渲染入口
// ═══════════════════════════════════════════════════════════════
var CURRENT = null;

function applyData(data) {
  var s = data.summary;

  document.getElementById('range').textContent = data.range || '';
  document.getElementById('trendSub').textContent =
    data.series.length + ' 天 · 按日（数据源只到天，没有更细的粒度）';
  var tps = data.types || [], sparseN = 0, ti;
  for (ti = 0; ti < tps.length; ti++) if (tps[ti].mode === 'sparse') sparseN++;
  // 考核表的公式是「当月合格数量/总数量」，这里是滚动窗口 —— 跨月时
  // 两个数不一样。大屏上的数常被直接抄去上报，不写明就会抄错
  GROUP_SUB_ALL = tps.length + ' 个类型 · 共用同一纵轴，形状可直接互比 · 目标线为季度 KPI'
    + (sparseN ? '（其中 ' + sparseN + ' 个样本不足，只给区间值不画趋势）' : '')
    + ' · 区间为滚动 ' + data.series.length + ' 天，考核按当月累计，两者不等价';
  document.getElementById('groupSub').textContent = GROUP_SUB_ALL;
  document.getElementById('rateLabel').textContent =
    s.latestDate ? s.latestDate + ' 良品率' : '最新一日良品率';

  if (typeof s.rate === 'number') {
    document.getElementById('figRate').textContent = s.rate.toFixed(1);
    // 顶部这个数是全厂合计（接口 5 全量，1 − 不良数 ÷ 检验数），**不是考核指标**：
    // 考核表的质量类是四条线各自的一次合格率/直通率，没有全厂这一档，
    // 而且四条线口径互不相同，合起来的数本就不该拿一条推算线打红绿灯。
    // 以前这里显示「达标/未达标（目标 96.5%）」，是个假的红绿灯 ——
    // 挂在车间墙上一天，全车间都会记住那个假结论
    if (data.targetIsKpi === false) {
      document.getElementById('figStatus').innerHTML =
        '全厂合计 · 非考核指标（各线 KPI 见下方卡片）';
    } else {
      var g = GRADE[gradeOf(s.rate, data.target)];
      document.getElementById('figStatus').innerHTML =
        '<span class="ic" style="color:' + g.color + '">' + g.icon + '</span>' +
        g.text + '（目标 ' + data.target + '%）';
    }
  } else {
    document.getElementById('figRate').textContent = '--';
    document.getElementById('figStatus').textContent = '当日无检验数据';
  }

  // 方向由箭头字符承担，颜色只是加强
  var dl = document.getElementById('figDelta');
  if (typeof s.rateDelta === 'number') {
    var up = s.rateDelta >= 0;
    dl.innerHTML = '<span class="ar" style="color:' + (up ? 'var(--good)' : 'var(--critical)') + '">' +
      (up ? '↑' : '↓') + '</span>' +
      Math.abs(s.rateDelta).toFixed(1) + ' 个百分点 · 较' + s.deltaBase +
      (typeof s.periodRate === 'number' ? ' · 区间累计 ' + s.periodRate.toFixed(1) + '%' : '');
  } else dl.textContent = '';

  document.getElementById('figDefect').textContent = group(s.defect || 0);
  var ddl = document.getElementById('figDefectDelta');
  // 「不计为不良数」的扣除必须写在这儿。屏上的不良数是**扣过**的，OA 里的
  // 原始数比它大 —— 谁拿两边一对就会发现差一截，而屏上没有任何解释。
  // 扣除是有意为之（2026-08-08 拍板：不计入不良的不算），但有意不等于可以隐形。
  // 这也正是大屏和质量周报差约 0.6pt 的原因。
  var ncn = data.crossCheck && data.crossCheck.notCountedNote;
  var dtxt = '';
  if (typeof s.defectDelta === 'number') {
    var dUp = s.defectDelta >= 0;
    dtxt = '<span class="ar" style="color:' + (dUp ? 'var(--critical)' : 'var(--good)') + '">' +
      (dUp ? '↑' : '↓') + '</span>' +
      Math.abs(s.defectDelta) + ' 件 · 较' + s.deltaBase;
  }
  if (ncn) dtxt += (dtxt ? '<br>' : '') + '<span style="color:var(--ink-muted)">' + esc(ncn) + '</span>';
  ddl.innerHTML = dtxt;

  buildSparks(data);
  buildLoopPages(data);
  renderTable(data);

  // 分子分母不同源的风险要显式暴露，不能静默地错。
  // 目标线缺失排在它前面 —— 那是「这块屏现在判不了达标」，比口径偏差更要紧
  var warn = document.getElementById('bannerWarn');
  var missing = data.targetYearsMissing || [];
  if (missing.length) {
    warn.textContent = '◆ ' + missing.join('、') + ' 年的目标线还没设，这些日子不画目标线也不判达标。'
      + '考核表一年一发，请在 config.json 的 targets 里补上「' + missing[0] + '」那一档。';
    warn.className = 'banner warn show';
  } else if (data.crossCheck && !data.crossCheck.ok) {
    warn.textContent = '◆ 口径提示：' + data.crossCheck.note;
    warn.className = 'banner warn show';
  } else warn.className = 'banner warn';

  document.getElementById('source').textContent = data.counts
    ? '日报 ' + data.counts['日报记录'] + ' 条 / 异常 ' + data.counts['异常记录'] + ' 条'
    : '示例数据';
  document.getElementById('lastUpdate').textContent = '最后更新 ' + hms(new Date(data.updatedAt));
}

function drawCharts() {
  if (!CURRENT) return;
  renderTrend(CURRENT);
  renderDefects(CURRENT);
  drawStage();
}

function render(data) {
  CURRENT = data;
  applyData(data);
  showLoopPage();   // 把当前页的 DOM 摆好，fit() 才量得到正确高度
  loopArm();        // 必须在 fit() 之前：fit() 万一抛异常，轮播不能跟着一起死
  fit();
}

// ═══════════════════════════════════════════════════════════════
// 自适配：根字号 = 视口 / 设计稿
//
// 原版用 clamp() + vw，在 MAXHUB 上有两个问题：clamp 是 Chromium 79，
// 老内核直接整条声明作废；而且 clamp 有上限，4K 面板上字号封顶后
// 相对屏幕就偏小了。改成整体按比例缩放，物理尺寸恒定。
//
// 画完再量一次真实高度，超出就回缩 —— 提示条弹出来时高度会变，
// 靠这一步兜住，保证永远是一屏，不出现需要滑动才看得全的情况
// ═══════════════════════════════════════════════════════════════
var DESIGN_W = 1920, DESIGN_H = 1080, BASE = 16;

function fit() {
  var doc = document.documentElement;
  var vw = doc.clientWidth, vh = doc.clientHeight;
  // 全屏切换过程中量到过 0 —— 那时候 k 算出来是 0，根字号被设成 0px，
  // 整块看板会塌成看不见，而且要等下一次 resize 才可能恢复。
  // 量不到就直接不动，保持上一次的字号
  if (!vw || !vh) return;
  var k = Math.min(vw / DESIGN_W, vh / DESIGN_H);
  doc.style.fontSize = (BASE * k) + 'px';
  drawCharts();

  // 这里原来有一条「表格展开时不回缩」的例外：那时表格是 <details>，
  // 展开后又宽又高，为了塞进一屏把整块看板缩小会让所有字都变小。
  // 现在表格常驻在一个定高的盒子里自己滚，看板总高恒定且可预测，
  // 这条例外就不需要了 —— 回缩规则重新变得没有特例，永远保证一屏
  var h = document.getElementById('board').offsetHeight;
  if (h > vh) {
    doc.style.fontSize = (BASE * k * (vh / h) * 0.995) + 'px';
    drawCharts();
  }

  autoScrollSync();   // 字号一变，内容高度跟着变，滚动区间要重算（但不重置位置）
}

// ═══════════════════════════════════════════════════════════════
// 表格自动上下滚
//
// 车间这块屏没有鼠标也没有人操作，滚动条是给不了的 —— 要么自己滚，
// 要么下半截的数永远没人看得到。
//
// 走 scrollTop 逐帧步进，不用 CSS transition/animation：老 WebView 上
// 长时间跑的 CSS 动画会掉帧甚至被合成器丢掉，而这块屏是几个月不重启的。
// 一格一格地加，慢但绝不会停。
//
// 节奏：顶部停 3 秒 → 匀速滚到底 → 底部停 3 秒 → 跳回顶 → 再停 3 秒 → 循环。
//
// 单向滚 + 跳回顶，不是往复滚。两端各停 3 秒，跳回去之后**还要再停一次**
// 才开始滚 —— 跳变是瞬间的，紧接着就动的话，人会分不清刚才是跳回了顶部
// 还是画面出了问题；停一拍，让顶部这一屏先落定
// ═══════════════════════════════════════════════════════════════
// 和轮播同一个教训，这里踩得更狠：原来「量到 over <= 2 就 stopAutoScroll()」
// 是一条**永久死路**。全屏切换过程中盒子会短暂量出 0（scrollHeight 和
// clientHeight 都读到 0），于是定时器被停掉，而当时只有 fit() 会再叫醒它 ——
// 全屏之后不一定还有 fit()，表格就再也不滚了。表现正是「全屏时只滚一次」。
//
// 现在两条都改掉：
//   · 进度按**真实经过的时间**算，不再假设定时器精确每 40ms 触发一次
//     （被节流时，旧写法的 3 秒停顿和滚动速度都会失真）
//   · 每秒的时钟心跳兼任**看门狗**：定时器要是死了、而内容确实溢出，
//     下一秒就把它接回来。停表因此变成可恢复的，不再是绝路
var AS_STEP_MS   = 40;      // 刷新间隔（只管画得顺不顺，不再决定速度）
var AS_SPEED     = 15;      // 滚动速度：px/秒
var AS_PAUSE_MS  = 3000;    // 顶部和底部各停多久

// 速度按 px/秒 定，不按「一趟滚多少秒」定：表格高度随数据变（产品多一行就高
// 一截），定成固定时长的话，数据一多字就飞得快，正好在最该看的时候读不了。
// 定成速度，读起来永远是同一个节奏。
//
// 现场调：网址后面加 ?scroll=10 就是 10 px/秒（越慢越从容），允许 3~60，
// 越界的值当没写。改完刷新即可，不用重新部署
(function () {
  var m = /[?&]scroll=([^&]*)/.exec(location.search);
  if (!m) return;
  var n = parseFloat(decodeURIComponent(m[1]));
  if (isFinite(n) && n >= 3 && n <= 60) AS_SPEED = n;
})();
var asTimer = null;
var asLast = 0;             // 上一帧的时刻，用来算真实 dt
var asHold = 0;             // 还要停多少毫秒
var asPos  = 0;             // 当前位置（小数累积，scrollTop 只能是整数）

function asBox() { return document.getElementById('tvBox'); }

// 每秒由 tickClock 调一次（看门狗），fit() 改完字号后也调一次。
// **不动当前位置** —— 顺手拉回顶端的话，滚动永远走不完一轮
function autoScrollSync() {
  var box = asBox();
  if (!box) return;
  var over = box.scrollHeight - box.clientHeight;
  var hint = document.getElementById('tvHint');
  // 这个函数每秒都被心跳调一次，文字没变就别写 DOM ——
  // 每秒一次无谓的 textContent 赋值会带来每秒一次的布局失效
  var label = over <= 2 ? '' : '自动滚动 · 到底回顶';
  if (hint && hint.textContent !== label) hint.textContent = label;

  if (over <= 2) {
    // 内容放得下（或这一刻根本量不出来）：停表。
    // 现在停是安全的 —— 下一秒心跳还会再来看一眼
    stopAutoScroll();
    return;
  }
  if (asPos > over) { asPos = over; box.scrollTop = over; }   // 字号变了，别停在区间外
  if (!asTimer) startAutoScroll();
}

// 回到顶端重新开始。只在表格内容真的换了的时候调（见 renderTable）
function autoScrollReset() {
  var box = asBox();
  if (!box) return;
  asPos = 0;
  box.scrollTop = 0;
  asLast = 0;
  // 先停一拍再开滚：不先停的话，页面刚出来表格就已经在动，
  // 第一张表（按日的检验数/不良数/良品率）会在没人看清之前滚过去
  asHold = AS_PAUSE_MS;
  autoScrollSync();
}

function stopAutoScroll() {
  if (asTimer) { clearInterval(asTimer); asTimer = null; }
  asLast = 0;               // 下次接回来时重新起算，别把停摆那段算成 dt
}

function startAutoScroll() {
  stopAutoScroll();
  asTimer = setInterval(function () {
    var box = asBox();
    if (!box) return;
    var over = box.scrollHeight - box.clientHeight;
    // 这一拍量不出来（全屏切换中）就跳过，**不停表** ——
    // 停在这里等于把恢复的机会交给一个不一定会来的 fit()
    if (over <= 2) { asLast = 0; return; }

    var now = Date.now();
    var dt = asLast ? now - asLast : AS_STEP_MS;
    asLast = now;
    if (dt > 1000) dt = 1000;   // 被挂起过，别一帧就冲到底

    if (asHold > 0) { asHold -= dt; return; }

    // 停够了 → 跳回顶端，再停一拍才继续滚
    if (asPos >= over) {
      asPos = 0;
      box.scrollTop = 0;
      asHold = AS_PAUSE_MS;
      return;
    }

    asPos += AS_SPEED * dt / 1000;
    if (asPos >= over) { asPos = over; asHold = AS_PAUSE_MS; }   // 到底，钉住停 3 秒
    box.scrollTop = Math.round(asPos);
  }, AS_STEP_MS);
}

// ═══════════════════════════════════════════════════════════════
// 和服务器对表
//
// 屏上的时钟和「最后更新」都是用平板自己的系统时间显示的。这台平板要是
// 没配 NTP 或者时区设错了，两个时间会一起错，而且看起来完全正常 ——
// 没有任何迹象能让人发现，这比停摆更隐蔽。
//
// 拿服务端的 updatedAt 对一次表：刚取数成功还差这么多，那就是钟的问题。
// 服务端向 OA 取数有 5 分钟缓存，updatedAt 合理地会落后几分钟，所以
// 「偏快」这侧留 15 分钟余量；「偏慢」正常不该出现，只留 2 分钟
// ═══════════════════════════════════════════════════════════════
var CLOCK_AHEAD_MS  = 15 * 60 * 1000;
var CLOCK_BEHIND_MS =  2 * 60 * 1000;

function checkClock(data) {
  var bar = document.getElementById('bannerClock');
  var t = data && data.updatedAt ? Date.parse(data.updatedAt) : NaN;
  if (!t) { bar.className = 'banner warn'; return; }

  var drift = Date.now() - t;
  if (drift > CLOCK_AHEAD_MS || drift < -CLOCK_BEHIND_MS) {
    // 措辞上不把责任一口咬死在平板上（服务器的钟也可能是错的），
    // 但先查哪一头是明确的
    bar.textContent = '◆ 时间异常：大屏与服务器的时钟相差约 ' +
      Math.round(Math.abs(drift) / 60000) + ' 分钟（大屏偏' + (drift > 0 ? '快' : '慢') +
      '）。屏上的时钟和「最后更新」都不可信，请先检查这台平板的日期、时间与时区设置。';
    bar.className = 'banner warn show';
  } else {
    bar.className = 'banner warn';
  }
  fit();
}

// ═══════════════════════════════════════════════════════════════
// 拉数据：连续失败才报警（一次网络抖动不弹提示，避免误报），
// 并明确写出「当前显示的是多久以前的旧数据」——
// 看板最危险的不是黑屏，是挂着两小时前的数字还没人发现
// ═══════════════════════════════════════════════════════════════
var failCount = 0, lastOkTime = null;

function load() {
  // 离线快照模式：数据已经烤进文件，压根不联网。
  // export-snapshot.js 会在主 script 前面注入一个 var SNAPSHOT = {...}。
  // 这条路径是为「大屏上没有浏览器、只能用系统自带 HTML 查看器」准备的 ——
  // U 盘插上点开就是完整看板，不需要服务器、防火墙、Wi-Fi 里任何一样。
  // 没注入时 SNAPSHOT 是 undefined，守卫不成立，联网模式一切照旧。
  if (typeof SNAPSHOT !== 'undefined' && SNAPSHOT) {
    render(SNAPSHOT);
    var sb = document.getElementById('bannerErr');
    // 必须写明「不会自动更新」：一屏静态数字看起来跟实时的一模一样，
    // 这正是看板最危险的情形
    sb.textContent = '◆ 离线快照，数据截止 ' + (SNAPSHOT.dataAt || SNAPSHOT.snapshotAt || '未知')
      + '（导出于 ' + (SNAPSHOT.snapshotAt || '未知') + '），不会自动更新。'
      + '需要最新数据请重新导出。';
    sb.className = 'banner err show';
    fit();
    // 不调 checkClock：快照本来就是旧的，报「数据过时」是误报
    return Promise.resolve();
  }

  return loadQuality().then(function (data) {
    render(data);
    failCount = 0;
    lastOkTime = Date.now();
    document.getElementById('bannerErr').className = 'banner err';
    checkClock(data);
  }, function (err) {
    if (window.console) console.error('获取质量数据失败:', err);

    // 还没配 OA 账号 —— 这不是故障，是没装完。说清楚该去哪，别报成连接异常
    if (err && err.needSetup) {
      failCount = 0;
      render(withRange(DEMO, '示例数据（尚未配置 OA 账号）'));
      var b = document.getElementById('bannerErr');
      // 改用 textContent：这条提示以前塞了个去 /setup 的链接，但大屏上点不动
      // 也输不了密码，等于把人引到死路上。现在直接把服务端那条命令写出来，
      // 让看到的人知道该去哪台机器上敲什么。
      b.textContent = '◆ 还没配置 OA 账号，下面显示的是示例数据。'
        + '请在跑 server.js 的那台电脑上执行：node server.js --set-account <OA账号>'
        + '（只需一次，之后大屏一直用这个账号取数）。';
      b.className = 'banner err show';
      fit();
      return;
    }

    failCount++;
    if (lastOkTime === null && failCount === 1) {
      // 没有后端（比如把文件拷出来直接双击）→ 用示例数据把版面显示出来
      render(DEMO);
      // 但要说清楚为什么没数据、以及怎么办 —— 否则一屏假数据看起来跟真的一样
      if (location.protocol === 'file:' && !SERVER) {
        var nb = document.getElementById('bannerErr');
        nb.textContent = '◆ 这是直接打开的本地文件，还没指定服务器地址，下面是示例数据。'
          + '推荐改用 http://<服务器内网IP>:3200/board 打开；'
          + '一定要用本地文件的话，在网址后面加 ?server=http://<服务器内网IP>:3200 '
          + '打开一次，这台设备就会记住。';
        nb.className = 'banner err show';
        fit();
      }
      return;
    }
    if (failCount >= 2) {
      var stale = lastOkTime
        ? '，页面显示的是 ' + Math.round((Date.now() - lastOkTime) / 1000) + ' 秒前的旧数据'
        : '';
      var eb = document.getElementById('bannerErr');
      eb.textContent = '■ 数据连接异常（已连续失败 ' + failCount + ' 次：' +
        (err && err.message ? err.message : '未知错误') + '）' +
        (SERVER ? '，服务器 ' + SERVER : '') + stale;
      eb.className = 'banner err show';
      fit();
    }
  });
}

// 页脚标出这块屏到底在向谁要数 —— 只有 file:// 跨机器取数时才有歧义，
// 通过 http 打开时地址栏已经写着了，不用重复
function showServerTag() {
  document.getElementById('serverTag').textContent = SERVER ? '数据源 ' + SERVER : '';
}

showServerTag();

// 每秒一次的心跳。除了走时钟，还兼两件事：
//   · 轮播搭这趟车（不自己另开一个会被清零的定时器）
//   · 给表格滚动当看门狗：它的 40ms 定时器要是被全屏切换或系统节流弄停了，
//     下一秒就接回来。看门狗是整套的关键 —— 有它，任何一处「停表」都只是
//     暂时的，不会变成再也起不来
function tickClock() {
  document.getElementById('clock').textContent = hms(new Date());
  loopTick();
  autoScrollSync();
}

// ═══════════════════════════════════════════════════════════════
// 安卓浏览器的三个坑
// ═══════════════════════════════════════════════════════════════

// (1) 切后台 / 息屏 / 切信号源之后，定时器会被节流甚至完全暂停，
//     时钟停在旧时间且不会自纠，轮询也停了。回前台立刻补一次。
//     轮播不在这里重启 —— 它记的是「上次翻页的时刻」，醒来后 tickClock
//     一比对就自己补上了，这里再插一手反而容易把进度弄乱
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) {
    tickClock(); load(); keepAwake(); autoScrollSync(); fit();
  } else {
    stopAutoScroll();
  }
});

// (2) 屏幕自己睡。wakeLock 要 Chromium 84+ 且 https，
//     拿不到就退回到在 MAXHUB 系统设置里关休眠
var wakeLock = null;
function keepAwake() {
  try {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(
        function (s) { wakeLock = s; },
        function () {}
      );
    }
  } catch (e) {}
}

// (3) 地址栏在偷高度，而且滚动时高度还会变。MAXHUB 自带浏览器不一定有
//     kiosk 模式，第一次触摸时进全屏是最省事的办法
document.addEventListener('click', function once(ev) {
  // 别抢链接和表格视图的点击
  var t = ev.target;
  while (t && t !== document.body) {
    if (t.tagName === 'A' || t.tagName === 'SUMMARY') return;
    t = t.parentNode;
  }
  var e = document.documentElement;
  var fs = e.requestFullscreen || e.webkitRequestFullscreen || e.mozRequestFullScreen;
  if (fs) { try { fs.call(e); } catch (err) {} }
  document.removeEventListener('click', once);
});

window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
document.addEventListener('fullscreenchange', function () { setTimeout(fit, 100); });
document.addEventListener('webkitfullscreenchange', function () { setTimeout(fit, 100); });
// 表格视图以前是 <details>，这里原来监听 toggle 来重算高度、并在展开时
// 暂停轮播。现在表格常驻展开、在自己的盒子里滚，没有 toggle 可听了，
// 整个监听连同那套暂停逻辑一起删掉。

// ═══════════════════════════════════════════════════════════════
// 启动
// ═══════════════════════════════════════════════════════════════
tickClock();
setInterval(tickClock, 1000);
keepAwake();
load();
setInterval(load, 60000);   // 数据源是按日的，没必要 3 秒一刷
</script>
</body>
</html>
